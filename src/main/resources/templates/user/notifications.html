<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <th:block layout:fragment="pageCss">
        <link rel="stylesheet" href="/css/main/main.css">
        <script src="https://cdn.tailwindcss.com"></script>
        <script>
            tailwind.config = {
                corePlugins: { preflight: false, container: false },
                important: '#tailwind-zone', 
                theme: {
                    extend: {
                        colors: { 
                            "primary": "#13ec5b",
                            "background-light": "#f6f8f6",
                            "background-dark": "#102216",
                        }
                    }
                }
            }
        </script>
        <style>
            #tailwind-zone { 
                font-family: 'Manrope', 'Noto Sans KR', sans-serif; 
                background-color: #f8faf9; 
                min-height: 100vh;
            }
            footer, .footer { display: none !important; }
            .dark-bg-custom { background-color: #0d130f; }
        </style>
    </th:block>

    <th:block layout:fragment="pageJs">
        <script th:inline="javascript">
            document.addEventListener('DOMContentLoaded', function() {
                const totalToggle = document.querySelector('input[data-type="total"]');
                const subToggles = document.querySelectorAll('input:not([data-type="total"])');

                if (totalToggle) {
                    totalToggle.addEventListener('change', function() {
                        const isChecked = this.checked;
                        subToggles.forEach(toggle => { toggle.checked = isChecked; });
                        updateNotification('total', isChecked);
                    });
                }

                subToggles.forEach(toggle => {
                    toggle.addEventListener('change', function() {
                        const type = this.getAttribute('data-type');
                        const status = this.checked;
                        updateNotification(type, status);
                        
                        // 하나라도 꺼지면 전체 스위치 OFF
                        if (!status && totalToggle) totalToggle.checked = false;
                        // 모두 켜지면 전체 스위치 ON
                        if (status && Array.from(subToggles).every(t => t.checked)) {
                            if (totalToggle) totalToggle.checked = true;
                        }
                    });
                });

                function updateNotification(type, status) {
                    console.log(`서버 전송: [${type} : ${status}]`);
                    fetch('/mypage/settings/notifications/update', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ type: type, status: status })
                    })
                    .then(response => {
                        if (response.ok) console.log(`${type} 설정 저장 완료`);
                    });
                }
            });
        </script>
    </th:block>
</head>
<body>
	<div layout:fragment="content">
	        <div id="tailwind-zone" class="bg-[#f8faf9] dark:bg-[#0d130f] min-h-screen">
	            <div class="layout-container w-full max-w-2xl mx-auto px-4 py-8 flex flex-col gap-8 flex-1">
	                
	                <div class="flex items-center gap-3">
	                    <button class="p-2 -ml-2 rounded-full hover:bg-gray-100 dark:hover:bg-white/10 transition-colors text-gray-700 dark:text-white border-none bg-transparent cursor-pointer" 
	                            onclick="history.back()">
	                        <span class="material-symbols-outlined" style="font-size: 24px;">chevron_left</span>
	                    </button>
	                    <h1 class="text-2xl font-extrabold text-[#111813] dark:text-white tracking-tight">알림 설정</h1>
	                </div>
	                
	                <div class="flex flex-col gap-6">
	                    <div class="bg-white dark:bg-white/5 rounded-2xl border border-[#f0f4f2] dark:border-white/5 overflow-hidden shadow-sm">
	                        
	                        <div class="flex items-center justify-between p-5 border-b border-[#f0f4f2] dark:border-white/5 bg-gray-50/50 dark:bg-white/5">
	                            <div class="flex flex-col gap-0.5">
	                                <span class="text-lg font-bold text-[#111813] dark:text-white">푸시 알림 전체</span>
	                                <span class="text-sm text-gray-500 dark:text-gray-400">모든 알림을 한 번에 켜거나 끕니다.</span>
	                            </div>
	                            <label class="relative inline-flex items-center cursor-pointer">
	                                <input type="checkbox" 
	                                       th:checked="${settings.chatNoti and settings.activityNoti and settings.marketingNoti}" 
	                                       class="sr-only peer" data-type="total">
	                                <div class="w-12 h-7 bg-gray-200 peer-focus:outline-none rounded-full peer dark:bg-gray-700 peer-checked:after:translate-x-full peer-checked:bg-primary after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-6 after:w-6 after:transition-all"></div>
	                            </label>
	                        </div>

	                        <div class="p-2">
	                            <div class="flex items-center justify-between p-4 hover:bg-gray-50 dark:hover:bg-white/5 rounded-xl transition-colors">
	                                <div class="flex flex-col">
	                                    <span class="font-bold text-[#111813] dark:text-white">채팅 알림</span>
	                                    <span class="text-xs text-gray-400 dark:text-gray-500 mt-0.5">새로운 채팅 메시지가 오면 알려줍니다.</span>
	                                </div>
	                                <label class="relative inline-flex items-center cursor-pointer">
	                                    <input type="checkbox" th:checked="${settings.chatNoti}" class="sr-only peer" data-type="chat">
	                                    <div class="w-11 h-6 bg-gray-200 rounded-full peer dark:bg-gray-700 peer-checked:after:translate-x-full peer-checked:bg-primary after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-5 after:w-5 after:transition-all"></div>
	                                </label>
	                            </div>

	                            <div class="flex items-center justify-between p-4 hover:bg-gray-50 dark:hover:bg-white/5 rounded-xl transition-colors">
	                                <div class="flex flex-col">
	                                    <span class="font-bold text-[#111813] dark:text-white">활동 알림</span>
	                                    <span class="text-xs text-gray-400 dark:text-gray-500 mt-0.5">좋아요, 댓글, 팔로우 등 내 활동 관련 소식</span>
	                                </div>
	                                <label class="relative inline-flex items-center cursor-pointer">
	                                    <input type="checkbox" th:checked="${settings.activityNoti}" class="sr-only peer" data-type="activity">
	                                    <div class="w-11 h-6 bg-gray-200 rounded-full peer dark:bg-gray-700 peer-checked:after:translate-x-full peer-checked:bg-primary after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-5 after:w-5 after:transition-all"></div>
	                                </label>
	                            </div>

	                            <div class="flex items-center justify-between p-4 hover:bg-gray-50 dark:hover:bg-white/5 rounded-xl transition-colors">
	                                <div class="flex flex-col">
	                                    <span class="font-bold text-[#111813] dark:text-white">마케팅 정보 수신 동의</span>
	                                    <span class="text-xs text-gray-400 dark:text-gray-500 mt-0.5">이벤트 혜택 및 유용한 정보를 받아봅니다.</span>
	                                </div>
	                                <label class="relative inline-flex items-center cursor-pointer">
	                                    <input type="checkbox" th:checked="${settings.marketingNoti}" class="sr-only peer" data-type="marketing">
	                                    <div class="w-11 h-6 bg-gray-200 rounded-full peer dark:bg-gray-700 peer-checked:after:translate-x-full peer-checked:bg-primary after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-5 after:w-5 after:transition-all"></div>
	                                </label>
	                            </div>
	                        </div>
	                    </div>
	                </div>
	                <div class="h-20"></div>
	            </div>
	        </div>
	    </div>
	</body>
	</html>
