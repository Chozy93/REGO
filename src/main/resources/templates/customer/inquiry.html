<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">

<!-- page 전용 CSS -->
<th:block th:fragment="pageCss">
  <link rel="stylesheet" href="/css/customer/inquiry.css">
  <link rel="stylesheet" href="/css/customer/sidebar.css">
</th:block>

<div layout:fragment="content" class="container-content">

  <!-- ===============================
       Layout : Sidebar + Content
  =============================== -->
  <div class="inquiry-layout">

    <!-- Sidebar -->
    <th:block
      th:replace="fragments/sidebar/policy-sidebar :: sidebar(currentMenu='inquiry')">
    </th:block>

    <!-- ===============================
         Inquiry Main Content
    =============================== -->
    <main class="inquiry-main">

      <!-- Header -->
      <div class="inquiry-header">
        <a href="#" class="inquiry-back" onclick="history.back()">
          <span class="material-symbols-outlined">arrow_back</span>
        </a>

        <div>
          <h1 class="inquiry-title">1:1 문의</h1>
          <p class="inquiry-desc">
            궁금한 점을 남겨주시면 담당자가 순차적으로 답변해 드립니다.
          </p>
        </div>
      </div>

      <!-- Card -->
      <section class="inquiry-card">
        <form class="inquiry-form">

          <!-- 문의 유형 -->
          <div class="form-field">
            <label class="form-label">
              문의 유형 <span class="required">*</span>
            </label>

            <div class="select-box">
              <select name="type">
                <option value="">문의하실 유형을 선택해주세요</option>
                <option value="ACCOUNT">계정 / 로그인</option>
                <option value="BUY">구매 관련</option>
                <option value="SELL">판매 관련</option>
                <option value="DELIVERY">배송 / 택배</option>
                <option value="REPORT">사기 신고</option>
                <option value="EVENT">이벤트 / 혜택</option>
                <option value="ETC">기타</option>
              </select>
              <span class="material-symbols-outlined">expand_more</span>
            </div>
          </div>

          <!-- 제목 -->
          <div class="form-field">
            <label class="form-label">
              제목 <span class="required">*</span>
            </label>
            <input type="text" placeholder="제목을 입력해주세요">
          </div>

          <!-- 내용 -->
          <div class="form-field">
            <label class="form-label">
              상세 문의 내용 <span class="required">*</span>
            </label>
            <textarea rows="6"
              placeholder="문의하실 내용을 상세히 적어주세요. (주문번호, 상품명 등)">
            </textarea>
          </div>

          <!-- 파일 -->
          <div class="form-field">
            <label class="form-label">사진 첨부</label>
            <label class="file-drop">
              <span class="material-symbols-outlined">cloud_upload</span>
              <p><strong>클릭하여 업로드</strong> 또는 드래그</p>
              <small>JPG, PNG (최대 10MB)</small>
              <input type="file" hidden>
            </label>
          </div>

          <!-- footer -->
          <div class="form-footer">
            <label class="checkbox">
              <input type="checkbox">
              <span>개인정보 수집 및 이용에 동의합니다.</span>
            </label>

            <button type="submit" class="btn btn-primary">
              문의하기
            </button>
          </div>

        </form>
      </section>

      <!-- Info -->
      <div class="inquiry-info">
        <span class="material-symbols-outlined">info</span>
        <div>
          <h4>안내사항</h4>
          <ul>
            <li>문의 내역은 마이페이지에서 확인 가능합니다.</li>
            <li>답변 완료 시 알림 또는 이메일로 안내됩니다.</li>
            <li>답변은 순차 처리됩니다.</li>
          </ul>
        </div>
      </div>

    </main>
  </div>
</div>

<th:block layout:fragment="pageJs">
  <script th:src="@{/js/customer/inquiry.js}" defer></script>
</th:block>

</html>
