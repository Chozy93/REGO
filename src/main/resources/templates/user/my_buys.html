<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title>내 구매 내역 - RE: GO</title>
    
    <th:block layout:fragment="pageCss">
        <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
        <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
        <script>
          tailwind.config = {
            darkMode: "class",
            theme: {
              extend: {
                colors: {
                  "primary": "#13ec5b",
                  "background-light": "#f6f8f6",
                  "background-dark": "#102216",
                },
                fontFamily: {
                  "display": ["Manrope", "Noto Sans", "sans-serif"]
                },
                borderRadius: {"DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px"},
              },
            },
          }
        </script>
        <style>
            body { font-family: 'Manrope', 'Noto Sans KR', sans-serif; }
            .no-scrollbar::-webkit-scrollbar { display: none; }
            footer, .footer { display: none !important; }
            .product-card { cursor: pointer; }
        </style>
    </th:block>
</head>

<body class="bg-background-light dark:bg-background-dark min-h-screen flex flex-col">
    <div layout:fragment="content">
        <div class="layout-container w-full max-w-[1280px] mx-auto px-4 py-8 flex flex-col md:flex-row gap-6 flex-1">
            
            <aside class="w-full md:w-64 flex-shrink-0">
                <div class="bg-white dark:bg-white/5 rounded-2xl p-6 shadow-sm border border-[#f0f4f2] dark:border-white/5 space-y-6">
                    <div class="flex flex-col items-center pb-6 border-b border-[#f0f4f2] dark:border-white/5">
                        <img th:src="${(user.profileImg != null and user.profileImg != 'default.png') ? user.profileImg : 'https://lh3.googleusercontent.com/aida-public/AB6AXuD0ObRBFDRs_vob6idb6aYKUuIove2YF-wbvYCHg-2sm6qoyedO7RYGPgbD3YUragy7aKMdHZaGuFf9n2VN8bfXNLuaHQv41ulrqhVYIpmk3x64L5NlUFVVfia-ExqeHUsxo5vgQfQPtrASlzehup3VxN0K1KuHLfM_Jo4LSDScARNe9G-rzONQqnH5Zobrl4cD0Z9vAbXnHqFPATdIE6yqtnbrqSfNs-liXa-Ege7QLNN9juuw7GAvbZhH4XK8XgkJEehsTeeKTVY'}" 
                             class="size-20 rounded-full object-cover border-4 border-white dark:border-[#1A2C20] shadow-md bg-gray-200 mb-3" alt="Profile"/>
                        <h2 class="text-xl font-bold text-[#111813] dark:text-white" th:text="${user.nickname}">알뜰한토마토</h2>
                        <p class="text-xs text-gray-500 dark:text-gray-400 mt-1" th:text="${user.address}">서울시 강남구 역삼동</p>
                    </div>
                    <nav class="space-y-1">
                        <a class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-gray-600 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-white/5 transition-colors" href="/mypage/edit">
                            <span class="material-symbols-outlined text-[20px]">person</span>
                            <span class="text-sm font-medium">프로필 관리</span>
                        </a>
                        <a class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-gray-600 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-white/5 transition-colors" href="/mypage/sales">
                            <span class="material-symbols-outlined text-[20px]">inventory_2</span>
                            <span class="text-sm font-medium">판매 내역</span>
                        </a>
                        <a class="flex items-center gap-3 px-3 py-2.5 rounded-xl bg-primary/10 text-primary font-bold" href="/mypage/buys">
                            <span class="material-symbols-outlined text-[20px]">shopping_bag</span>
                            <span class="text-sm">구매 내역</span>
                        </a>
                    </nav>
                </div>
            </aside>

            <main class="flex-1">
                <div class="flex flex-col h-full space-y-6">
                    
                    <div class="flex flex-col gap-6">
                        <div class="flex items-center gap-4">
                            <button onclick="history.back()" class="p-1 hover:bg-gray-100 dark:hover:bg-white/10 rounded-full transition-colors">
                                <span class="material-symbols-outlined text-[#111813] dark:text-white" style="font-size: 28px;">chevron_left</span>
                            </button>
                            <h2 class="text-2xl font-bold text-[#111813] dark:text-white">내 구매 내역</h2>
                        </div>

                        <div class="bg-white dark:bg-white/5 rounded-2xl p-6 shadow-sm border border-[#f0f4f2] dark:border-white/5 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                            <div class="status-filters flex p-1 bg-gray-100 dark:bg-white/5 rounded-xl w-fit overflow-x-auto no-scrollbar">
                                <button data-filter="ALL" class="filter-btn px-4 py-2 text-sm font-bold rounded-lg bg-white dark:bg-white/10 text-[#111813] dark:text-white shadow-sm transition-all whitespace-nowrap">전체</button>
                                <button data-filter="TRADING" class="filter-btn px-4 py-2 text-sm font-medium rounded-lg text-gray-500 dark:text-gray-400 hover:text-[#111813] dark:hover:text-white transition-all whitespace-nowrap">거래중</button>
                                <button data-filter="SOLD" class="filter-btn px-4 py-2 text-sm font-medium rounded-lg text-gray-500 dark:text-gray-400 hover:text-[#111813] dark:hover:text-white transition-all whitespace-nowrap">거래완료</button>
                            </div>
                            <select id="sortOrder" class="form-select pl-3 pr-8 py-2 text-sm border-gray-200 dark:border-white/10 bg-transparent rounded-lg focus:ring-primary focus:border-primary dark:text-white">
                                <option value="latest">최신순</option>
                                <option value="price-high">가격 높은순</option>
                                <option value="price-low">가격 낮은순</option>
                            </select>
                        </div>
                    </div>

                    <div id="purchaseContent">
                        <div id="emptyMessage" class="hidden bg-white dark:bg-white/5 rounded-2xl p-12 shadow-sm border border-[#f0f4f2] dark:border-white/5 flex flex-col items-center justify-center text-center">
                            <div class="size-16 bg-gray-100 dark:bg-white/10 rounded-full flex items-center justify-center mb-4">
                                <span class="material-symbols-outlined text-gray-400 dark:text-gray-500" style="font-size: 32px;">shopping_cart</span>
                            </div>
                            <h3 class="text-lg font-bold text-[#111813] dark:text-white mb-1">구매한 내역이 없어요</h3>
                            <p class="text-sm text-gray-500 dark:text-gray-400">RE: GO에서 멋진 상품들을 구경해보세요!</p>
                        </div>

                        <div th:unless="${#lists.isEmpty(purchaseList)}" id="purchaseList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                            <div th:each="item : ${purchaseList}" 
                                 th:data-status="${item.salesStatusCode}" 
                                 th:data-price="${item.price}"
                                 th:data-date="${item.createdAt}"
                                 th:onclick="|location.href='/product/${item.productId}'|"
                                 class="product-card bg-white dark:bg-white/5 rounded-2xl overflow-hidden border border-[#f0f4f2] dark:border-white/5 hover:border-primary/50 hover:shadow-md transition-all group relative flex flex-col">
                                
                                <div class="relative aspect-[4/3] bg-gray-100 dark:bg-white/5 overflow-hidden">
                                    <img th:src="${item.mainImageUrl}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500"/>
                                    <div th:if="${item.salesStatusCode == 'SOLD'}" class="absolute inset-0 bg-black/40 flex items-center justify-center">
                                        <span class="px-3 py-1 bg-white/20 backdrop-blur-md rounded-lg text-white font-bold text-sm border border-white/30">거래 완료</span>
                                    </div>
                                    <div th:if="${item.salesStatusCode == 'TRADING'}" class="absolute top-2 right-2">
                                        <span class="px-2 py-1 bg-blue-500 text-white text-xs font-bold rounded-md shadow-sm">거래중</span>
                                    </div>
                                </div>

                                <div class="p-4 flex-1 flex flex-col justify-between space-y-3">
                                    <div>
                                        <h3 th:text="${item.productName}" class="text-base font-bold text-[#111813] dark:text-white line-clamp-1 group-hover:text-primary mb-1">상품명</h3>
                                        <div class="flex items-center gap-1 text-xs text-gray-500 dark:text-gray-400 mb-2">
                                            <span th:text="${item.regionDisplayName}">지역</span>
                                            <span>·</span>
                                            <span th:text="${item.createdAt}">시간</span>
                                        </div>
                                        <p th:text="${#numbers.formatInteger(item.price, 0, 'COMMA')} + '원'" class="text-lg font-extrabold text-[#111813] dark:text-white">가격</p>
                                    </div>

                                    <div class="pt-3 border-t border-[#f0f4f2] dark:border-white/5">
                                        <div class="flex items-center justify-between">
                                            <div class="flex items-center gap-2">
                                                <img th:src="${item.sellerProfileImg}" class="size-6 rounded-full object-cover bg-gray-200"/>
                                                <span th:text="${item.sellerNickname}" class="text-xs font-medium text-gray-600 dark:text-gray-300">판매자</span>
                                            </div>
                                            <div class="flex gap-1">
                                                <button th:if="${item.salesStatusCode == 'SOLD'}" th:onclick="|event.stopPropagation(); location.href='/mypage/review/write?productId=${item.productId}'|" 
                                                        class="px-2 py-1.5 bg-primary text-[#111813] text-[11px] font-bold rounded-lg hover:bg-primary/90 transition-colors">리뷰 작성</button>
                                                <button th:onclick="|event.stopPropagation(); location.href='/product/${item.productId}'|" 
                                                        class="px-2 py-1.5 bg-gray-100 dark:bg-white/10 text-[#111813] dark:text-white text-[11px] font-bold rounded-lg hover:bg-gray-200 transition-colors">상세보기</button>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div id="loadMoreContainer" class="flex justify-center mt-6">
                        <button id="loadMoreBtn" class="flex items-center gap-2 px-6 py-3 rounded-xl bg-white dark:bg-white/5 border border-[#f0f4f2] dark:border-white/10 hover:bg-gray-50 dark:hover:bg-white/10 text-gray-600 dark:text-gray-300 font-bold transition-all">
                            <span>더보기</span>
                            <span class="material-symbols-outlined">expand_more</span>
                        </button>
                    </div>

                </div>
            </main>
        </div>

        <script>
        document.addEventListener('DOMContentLoaded', function() {
            const purchaseList = document.getElementById('purchaseList');
            const emptyMessage = document.getElementById('emptyMessage');
            const filterBtns = document.querySelectorAll('.filter-btn');
            const sortSelect = document.getElementById('sortOrder');
            const loadMoreBtn = document.getElementById('loadMoreBtn');
            const cards = Array.from(document.querySelectorAll('.product-card'));
            
            let visibleCount = 6; 
            let currentFilter = 'ALL';

            function updateUI() {
                const filteredCards = cards.filter(card => {
                    const status = card.getAttribute('data-status');
                    return currentFilter === 'ALL' || status === currentFilter;
                });
                
                cards.forEach(card => card.style.display = 'none');
                filteredCards.forEach((card, index) => {
                    if (index < visibleCount) card.style.display = 'flex';
                });

                if (filteredCards.length === 0) {
                    emptyMessage.classList.remove('hidden');
                    if(purchaseList) purchaseList.style.display = 'none';
                } else {
                    emptyMessage.classList.add('hidden');
                    if(purchaseList) purchaseList.style.display = 'grid';
                }

                const container = document.getElementById('loadMoreContainer');
                if (container) {
                    if (visibleCount >= filteredCards.length) container.style.display = 'none';
                    else container.style.display = 'flex';
                }
            }

            filterBtns.forEach(btn => {
                btn.addEventListener('click', function() {
                    currentFilter = this.getAttribute('data-filter');
                    visibleCount = 6;
                    filterBtns.forEach(b => {
                        b.classList.remove('font-bold', 'bg-white', 'dark:bg-white/10', 'shadow-sm');
                        b.classList.add('font-medium', 'text-gray-500');
                    });
                    this.classList.add('font-bold', 'bg-white', 'dark:bg-white/10', 'shadow-sm');
                    this.classList.remove('font-medium', 'text-gray-500');
                    updateUI();
                });
            });

            if(loadMoreBtn) {
                loadMoreBtn.addEventListener('click', () => { visibleCount += 6; updateUI(); });
            }

            sortSelect.addEventListener('change', function() {
                const sorted = cards.sort((a, b) => {
                    if (this.value === 'price-high') return b.dataset.price - a.dataset.price;
                    if (this.value === 'price-low') return a.dataset.price - b.dataset.price;
                    return b.dataset.date.localeCompare(a.dataset.date);
                });
                sorted.forEach(card => purchaseList.appendChild(card));
                updateUI();
            });

            updateUI();
        });
        </script>
    </div>
</body>
</html>
