<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
	  
	  <th:block th:fragment="pageCss">
	    <link rel="stylesheet" href="/css/product/list.css">
	  </th:block>

<div layout:fragment="content">

  <!-- =========================
       CATEGORY BAR
  ========================= -->
  <section class="category-bar">
    <h2 class="category-title"
        th:text="${page.categoryBar.categoryName}">
      카테고리명
    </h2>

    <ul class="category-tabs">
      <li th:each="tab : ${page.categoryBar.tabs}"
          th:classappend="${tab.active} ? 'active'">

        <a th:href="@{/products(categoryId=${tab.categoryId})}"
           th:text="${tab.name}">
          탭명
        </a>

      </li>
    </ul>
  </section>

  <!-- =========================
       PRODUCT LIST
  ========================= -->
  <section class="product-list">

    <!-- 상품 없음 -->
    <div th:if="${#lists.isEmpty(page.cards)}"
         class="empty-message">
      등록된 상품이 없습니다.
    </div>

    <!-- 상품 카드 -->
    <div class="grid-products"
         th:if="${!#lists.isEmpty(page.cards)}">

      <th:block th:each="card : ${page.cards}">
		<th:block
		        th:replace="fragments/product-card :: card(${card})">
		      </th:block>
      </th:block>

    </div>

  </section>

</div>
</html>
