<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">

<!-- PAGE CSS -->
<th:block th:fragment="pageCss">
  <link rel="stylesheet" th:href="@{/css/product/product-card.css}">
  <link rel="stylesheet" th:href="@{/css/product/list.css}">
</th:block>

<div class="container-content" layout:fragment="content">

  <!-- CATEGORY BAR -->
  <section class="category-bar">

    <!-- 🔥 hover 기준 래퍼 -->
    <div class="category-nav-wrap">

      <!-- 대분류 영역 -->
      <div class="category-nav">
        <div class="category-dropdown">
          <a class="category-dropdown-toggle"
             th:href="@{/products(categoryId=${page.categoryGroup.parentCategoryId})}">
            <span th:text="${page.categoryGroup.parentCategoryName}">
              디지털기기
            </span>
            <svg width="14" height="14" viewBox="0 0 24 24">
              <path d="M7 10l5 5 5-5z"/>
            </svg>
          </a>
        </div>
      </div>

      <!-- 🔥 메가 드롭다운 패널 (같은 래퍼 안) -->
      <div class="category-mega-panel">
        <ul class="subcategory-grid">
          <li th:each="sub : ${page.categoryGroup.subCategories}"
              th:classappend="${sub.selected} ? 'is-active'">
            <a th:href="@{/products(categoryId=${sub.categoryId})}"
               th:text="${sub.categoryName}">
              소분류
            </a>
          </li>
        </ul>
      </div>

    </div>
  </section>

  <!-- PRODUCT LIST -->
  <section class="product-list">

    <div class="empty-result"
         th:if="${#lists.isEmpty(page.productList.products)}">
      등록된 상품이 없습니다.
    </div>

    <div class="product-grid"
         th:if="${!#lists.isEmpty(page.productList.products)}">

      <th:block th:each="card : ${page.productList.products}">
        <th:block
          th:replace="fragments/product-card :: productCard(${card})">
        </th:block>
      </th:block>

    </div>

  </section>

</div>
</html>
