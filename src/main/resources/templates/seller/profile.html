<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">

<th:block th:fragment="pageCss">
  <link rel="stylesheet" href="/css/seller/profile.css">
  <link rel="stylesheet" href="/css/fragments/product-card.css">
  <link rel="stylesheet"
        href="https://code.jquery.com/ui/1.13.3/themes/base/jquery-ui.css">
</th:block>

<div layout:fragment="content" class="seller-profile">

  <!-- Page Alias -->
  <th:block th:with="page=${sellerProfilePageViewVO}">

    <!-- ===============================
         Seller Summary
    =============================== -->
    <section class="seller-summary">
      <div class="seller-summary-inner">

        <div class="seller-avatar">
          <span class="material-symbols-outlined">person</span>
        </div>

        <div class="seller-info">
          <h1 class="seller-name"
              th:text="${page.profile.nickname}">
            판매자명
          </h1>

          <!-- 별점/후기: 이름 바로 밑에 붙기 + 배경/테두리 있는 칩 -->
          <div class="seller-rating-box"
               th:style="|--rating:${page.profile.ratingAvg};|">
            <div class="seller-stars">
              <span class="stars-bg">★★★★★</span>
              <span class="stars-fill">★★★★★</span>
            </div>

            <div class="seller-rating-score">
              <span class="seller-rating-value"
                    th:text="${page.profile.ratingAvg}">0.0</span>
              <span class="seller-review-count">
                후기 <span th:text="${page.profile.totalReviews}">0</span>
              </span>
            </div>
          </div>

          <!-- 소개글: 별점 밑 / 버튼 위로 고정되게 -->
          <p class="seller-desc"
             th:text="${page.profile.description}">
            판매자 소개
          </p>

          <div class="seller-actions">
            <button class="btn btn-primary profile-card-btn">팔로우</button>
            <button class="btn btn-outline profile-card-btn">프로필 공유</button>
          </div>
        </div>

        <div class="seller-stats">
          <div class="seller-stat">
            <strong class="seller-stat-value"
                    th:text="${page.profile.totalSales}">0</strong>
            <span class="seller-stat-label">판매중</span>
          </div>

          <div class="seller-stat">
            <strong class="seller-stat-value"
                    th:text="${page.profile.totalReviews}">0</strong>
            <span class="seller-stat-label">후기</span>
          </div>

          <div class="seller-stat">
            <strong class="seller-stat-value">0</strong>
            <span class="seller-stat-label">팔로워</span>
          </div>
        </div>

      </div>
    </section>

    <!-- ===============================
         Seller Tabs
    =============================== -->
    <div id="sellerTabs" class="seller-tabs-wrap">

      <ul class="seller-tabs">
        <li>
          <a href="#tab-selling" class="tab-btn">
            판매중
            <span class="seller-tab-count"
                  th:text="${#lists.size(page.sellingProducts)}">0</span>
          </a>
        </li>

        <li>
          <a href="#tab-completed" class="tab-btn">
            거래완료
            <span class="seller-tab-count"
                  th:text="${#lists.size(page.completedProducts)}">0</span>
          </a>
        </li>

        <li>
          <a href="#tab-reviews" class="tab-btn">
            받은후기
            <span class="seller-tab-count"
                  th:text="${page.profile.totalReviews}">0</span>
          </a>
        </li>
      </ul>

      <!-- ===============================
           판매중
      =============================== -->
      <section id="tab-selling" class="seller-products">

        <!-- 상품 있음 -->
        <th:block th:if="${!#lists.isEmpty(page.sellingProducts)}">
          <div class="product-grid">
            <th:block th:each="p : ${page.sellingProducts}">
              <th:block th:replace="fragments/product-card :: productCard(${p})"/>
            </th:block>
          </div>

          <div class="more-wrap">
            <a th:href="@{/search(sellerId=${page.profile.sellerId},status='SELLING')}"
               class="btn btn-soft">
              판매중 상품 전체보기
            </a>
          </div>
        </th:block>

        <!-- 상품 없음 -->
        <th:block th:if="${#lists.isEmpty(page.sellingProducts)}">
          <div class="seller-empty">
            <p class="seller-empty-title">아직 등록된 상품이 없습니다</p>
          </div>
        </th:block>

      </section>

      <!-- ===============================
           거래완료
      =============================== -->
      <section id="tab-completed" class="seller-products is-completed">

        <!-- 상품 있음 -->
        <th:block th:if="${!#lists.isEmpty(page.completedProducts)}">
          <div class="product-grid">
            <th:block th:each="p : ${page.completedProducts}">
              <th:block th:replace="fragments/product-card :: productCard(${p})"/>
            </th:block>
          </div>

          <div class="more-wrap">
            <a th:href="@{/search(sellerId=${page.profile.sellerId},status='COMPLETED')}"
               class="btn btn-soft">
              거래완료 상품 전체보기
            </a>
          </div>
        </th:block>

        <!-- 상품 없음 -->
        <th:block th:if="${#lists.isEmpty(page.completedProducts)}">
          <div class="seller-empty">
            <p class="seller-empty-title">아직 거래완료된 상품이 없습니다</p>
          </div>
        </th:block>

      </section>

      <!-- ===============================
           받은후기
      =============================== -->
      <section id="tab-reviews" class="seller-reviews">

        <!-- 후기 있음 -->
        <th:block th:if="${!#lists.isEmpty(page.reviews)}">

          <div class="review-filter">
            <select class="review-filter-select" id="reviewSortSelect">
              <option value="LATEST" selected>최신순</option>
              <option value="OLDEST">오래된순</option>
              <option value="RATING_DESC">별점 높은순</option>
              <option value="RATING_ASC">별점 낮은순</option>
            </select>
          </div>

          <article class="review-item" th:each="r : ${page.reviews}">
            <div class="review-left">
              <img class="review-avatar"
                   th:src="@{${r.buyerProfileImg}}"
                   alt="구매자 프로필">
            </div>

            <div class="review-center">
              <div class="review-top">
                <strong class="review-writer"
                        th:text="${r.buyerNickname}">구매자</strong>
                <span class="review-date"
                      th:text="${r.createdAt}">2026-01-23</span>
              </div>

              <a class="review-product-box"
                 th:href="@{/product/{id}(id=${r.productId})}">
                <span class="review-product-label">구매한 상품</span>
                <span class="review-product-title"
                      th:text="${r.productTitle}">상품명</span>
              </a>

              <p class="review-content"
                 th:text="${r.content}">
                상품 상태가 설명보다 훨씬 좋습니다.
              </p>
            </div>

            <div class="review-right">
              <div class="review-stars"
                   th:attr="data-rating=${r.rating}">
              </div>
            </div>
          </article>

          <div class="review-more">
            <button class="btn btn-soft" id="reviewMoreBtn">후기 더보기</button>
          </div>

        </th:block>

        <!-- 후기 없음 -->
        <th:block th:if="${#lists.isEmpty(page.reviews)}">
          <div class="review-empty-card">
            <p class="review-empty-title">아직 받은 후기가 없어요</p>
            <p class="review-empty-desc">
              거래가 완료되면<br>
              이곳에 후기가 표시돼요.
            </p>
          </div>
        </th:block>

      </section>

    </div>
  </th:block>
</div>

<th:block th:fragment="pageJs">
  <script src="https://code.jquery.com/ui/1.13.3/jquery-ui.min.js"></script>
  <script th:src="@{/js/seller/profile.js}"></script>
  <script th:src="@{/js/product-like.js}"></script>
</th:block>

</html>
