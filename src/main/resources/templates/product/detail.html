<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">

<th:block th:fragment="pageCss"> 
  <link rel="stylesheet" th:href="@{/css/product/detail.css}">
  <link rel="stylesheet" th:href="@{/css/fragments/report-modal.css}">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
</th:block>

<th:block th:fragment="pageJs">
  <script th:src="@{'//dapi.kakao.com/v2/maps/sdk.js?appkey=' + ${kakaoAppKey} + '&libraries=services'}"></script>
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  <script src="/js/product/detail.js"></script>
  <script src="/js/product/detail-report.js"></script>
  <script src="/js/product/recent-view.js"></script>
</th:block>

<div class="container-content" layout:fragment="content">

  <input type="hidden" id="productId" th:value="${page.product.productId}"/>

  <section class="product-detail-grid">

    <div class="detail-left">
      <section class="product-detail-media">
        <div class="swiper detail-swiper">
          <div class="swiper-wrapper">
            <div class="swiper-slide" th:if="${page.product.mainImageUrl != null}">
              <img th:src="${page.product.mainImageUrl}" alt="상품 이미지 1"/>
            </div>
            <div class="swiper-slide" th:if="${page.product.mainImageUrl != null}">
              <img th:src="${page.product.mainImageUrl}" alt="상품 이미지 2"/>
            </div>
            <div class="swiper-slide" th:if="${page.product.mainImageUrl != null}">
              <img th:src="${page.product.mainImageUrl}" alt="상품 이미지 3"/>
            </div>
            <div class="swiper-slide" th:if="${page.product.mainImageUrl == null}">
              <img src="/images/no-image.png" alt="기본 이미지"/>
            </div>
          </div>
          <div class="swiper-pagination"></div>
          <div class="swiper-button-next"></div>
          <div class="swiper-button-prev"></div>
        </div>
      </section>

      <div class="left-bottom-box">
        <section class="info-card seller-card" th:if="${page.sellerInfo != null}">
          <div class="seller-card-header">
            <div class="seller-card-profile">
              <span class="material-symbols-outlined">person</span>
            </div>
            <div class="seller-card-meta">
              <div class="seller-card-name" th:text="${page.sellerInfo.nickname}">판매자</div>
              <div class="seller-card-stats">
                <span>상품 <b th:text="${page.sellerInfo.productCount}">0</b></span>
                <span class="dot"></span>
                <span th:text="${page.sellerInfo.ratingLabel}">평점 없음</span>
              </div>
            </div>
            <a class="seller-profile-link" th:href="@{/seller/profile/{sellerId}(sellerId=${page.sellerInfo.sellerId})}">
              프로필 보기 <span class="material-symbols-outlined">chevron_right</span>
            </a>
          </div>
          <hr class="seller-divider">
          <div class="action-card product-detail">
			<th:block th:if="${page.isMine}">
			    <a th:href="@{/product/edit/{id}(id=${page.product.productId})}" class="btn-chat" style="flex: 1; text-align: center; text-decoration: none; display: flex; align-items: center; justify-content: center;">
			      <span class="material-symbols-outlined" style="margin-right: 4px;">edit</span>
			      상품 수정하기
			    </a>
			    </th:block>

			  <th:block th:unless="${page.isMine}">
			    <button type="button" class="product-card__like-btn"
			            th:data-product-id="${page.product.productId}"
			            th:data-login="${page.login}">
			      <span class="material-symbols-outlined" th:classappend="${page.product.liked} ? ' filled' : ''">favorite</span>
			    </button>
            <button type="button" id="dealBtn" class="btn-chat"
                    th:data-product-id="${page.product.productId}"
                    th:data-mine="${page.isMine}"
                    th:data-login="${page.login}">채팅하기</button>
            <button type="button" id="directPayBtn" class="btn-dark"
                    th:disabled="${page.isMine}"
                    th:data-product-id="${page.product.productId}">바로구매</button>
          </div>
        </section>
      </div>
    </div> <div class="detail-right">
      <div class="info-card product-summary">
        <div class="product-summary-header">
          <div class="product-category-path" th:if="${page.product.parentCategoryName != null}">
            <a th:href="@{/products(categoryId=${page.product.parentCategoryId})}" th:text="${page.product.parentCategoryName}">대분류</a>
            <span class="category-separator">›</span>
            <a th:href="@{/products(categoryId=${page.product.categoryId})}" th:text="${page.product.categoryName}">소분류</a>
            <button type="button" class="btn-report-text" data-action="open-report-modal"
                    th:data-login="${page.login}" th:data-product-id="${page.product.productId}"
                    th:disabled="${page.login == true and page.alreadyReported == true}">
              <span class="material-symbols-outlined" style="font-size: 16px; vertical-align: middle;">flag</span>
              <span th:text="${page.alreadyReported ? '신고 완료' : '신고하기'}">신고하기</span>
            </button>
          </div>
          <div class="product-title-row">
            <h1 class="product-title" th:text="${page.product.productName}">상품명</h1>
            <span class="badge product-status-badge" th:text="${page.product.salesStatusLabel}">판매중</span>
          </div>
        </div>
        <div class="product-price" th:text="${#numbers.formatInteger(page.product.price, 3, 'COMMA')}">0</div>
        <div class="product-meta">조회 <b th:text="${page.product.viewCount}">0</b></div>
      </div>

      <div class="info-card product-description">
        <h3>상품 정보</h3>
        <p th:text="${!#strings.isEmpty(page.product.description) ? page.product.description : '판매자가 등록한 상품입니다.'}"></p>
        <div class="product-recommend">
          <strong>이런 분께 추천해요</strong>
          <ul><li>✔ 합리적인 가격</li><li>✔ 근처 지역 직거래</li></ul>
        </div>
      </div>

      <div class="info-card trade-info">
        <h3>거래 정보</h3>
        <p id="tradeRegion" th:text="${page.product.sellerRegion}">지역 정보</p>
        <div id="map" style="width:100%; height:250px; border-radius: 12px; border: 1px solid #e5e7eb; margin-top:10px;"></div>
      </div>
    </div> </section> <div class="detail-bottom" th:if="${!#lists.isEmpty(page.similar.items)}">
    <section class="info-card similar-products">
		

		
      <h3 class="section-title">이 상품과 비슷한 추천 상품</h3>
      <div class="grid-products">
        <article class="recommend-card" th:each="item : ${page.similar.items}">
          <a th:href="@{/product/{id}(id=${item.productId})}">
            <div class="card-image-wrap">
              <img th:src="${item.thumbnailUrl}" th:alt="${item.productName}">
            </div>
            <div class="card-info">
              <div class="card-name" th:text="${item.productName}">상품명</div>
              <div class="card-price">
                <span th:text="${#numbers.formatInteger(item.price, 0, 'COMMA')}">0</span>원
              </div>
            </div>
          </a>
        </article>
      </div>
    </section>
  </div>

  <th:block th:replace="fragments/report-modal :: report-modal"></th:block>

</div>
</html>
