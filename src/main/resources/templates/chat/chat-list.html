<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">

<!-- page 전용 CSS -->
<th:block th:fragment="pageCss">
    <link rel="stylesheet" href="/css/chat/chat-list.css">
    <link rel="stylesheet" href="/css/chat/chat-room.css">
    <link rel="stylesheet" href="/css/fragments/chat-modal.css">
</th:block>

<div layout:fragment="content" class="chat-layout">

    <!-- =========================
         Left
    ========================== -->
    <aside class="chat-sidebar">

        <div class="chat-sidebar-head">
            <div class="chat-title-wrap">
                <h2 class="chat-sidebar-title">채팅</h2>

                <!-- 전체 / 안읽음 전환 드롭다운 -->
				<div class="chat-filter-option">
				  <select class="chat-filter-select"
				          onchange="location.href=this.value">
				    <option value="/chat/list"
				            th:selected="${unreadOnly == null}">
				      전체 대화
				    </option>
				    <option value="/chat/list?unreadOnly=true"
				            th:selected="${unreadOnly}">
				      안읽은 대화
				    </option>
				  </select>
				  <span class="chat-filter-arrow">▼</span>
				</div>

            </div>
        </div>

        <div class="chat-room-list">

			<div class="chat-room-item chat-room-link"
			   th:each="room : ${chatListItems.items}"
			   th:if="${room != null}"
			   th:attr="data-room-id=${room.roomId}"
			   >

                <div class="chat-room-avatar">
                    <span class="material-symbols-outlined">person</span>
                </div>

                <div class="chat-room-body">
                    <div class="chat-room-head">
                        <strong class="chat-room-name"
                                th:text="${room.opponentNickName}">
                        </strong>
                        <span class="chat-room-time"
                              th:text="${room.lastSentAtText}">
                        </span>
                    </div>

                    <div class="chat-room-bottom">
                        <p class="chat-room-preview"
                           th:text="${room.lastMessage}">
                        </p>

                        <div class="chat-room-unread"
                             th:if="${room.unreadCount > 0}">
                            <span class="unread-dot"></span>
                            <span class="unread-count"
                                  th:text="${room.unreadCount}">
                            </span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="chat-room-empty"
                 th:if="${#lists.isEmpty(chatListItems.items)}">
                대화 내역이 없습니다.
            </div>

        </div>

    </aside>

    <!-- =========================
         Right
    ========================== -->
	<section class="chat-room-container">

	  <!-- ❗️empty + chatRoomArea를 감싸는 wrapper -->
	  <div class="chat-room-stage">

	    <!-- 채팅방 미선택 -->
	    <div class="chat-empty" id="chatEmptyState">
	      <div class="chat-empty-inner">
	        <span class="material-symbols-outlined chat-empty-icon">chat_bubble</span>
	        <h3 class="chat-empty-title">대화방을 선택해주세요</h3>
	      </div>
	    </div>

	    <!-- Ajax fragment 삽입 -->
	    <div id="chatRoomArea" style="display:none"></div>

	  </div>
	</section>
	
	<span id="loginUserId" th:text="${loginUser != null ? loginUser.userId : 0}" hidden></span>

</div>
<!-- page JS -->
<th:block th:fragment="pageJs">
	<!-- WebSocket libs -->
	<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>

	<script src="/js/chat/chat-list.js"></script>
    <script src="/js/chat/chat-room.js"></script>
</th:block>

</html>
