<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">

<th:block th:fragment="pageCss">
  <link rel="stylesheet" href="/css/seller/product-register.css">
</th:block>

<div layout:fragment="content" class="seller-product-register">

  <!-- ===============================
       Page Header
  =============================== -->
  <header class="seller-product-register__header">
    <h1 class="seller-product-register__title">상품 판매 등록</h1>
    <p class="seller-product-register__desc">
      판매할 상품 정보를 입력해 주세요.<br>
      등록 후 검수 없이 바로 노출될 수 있습니다.
    </p>
  </header>

  <!-- ===============================
       Form
  =============================== -->
  <form class="seller-product-register__form"
        method="post"
        action="/seller/product/register"
        enctype="multipart/form-data">

    <!-- ===============================
         Images
    =============================== -->
    <section class="spr-section">
      <div class="spr-section__head">
        <h2 class="spr-section__title">상품 이미지</h2>
        <span class="spr-section__meta">(0/10)</span>
      </div>

      <div class="spr-images">
        <label class="spr-images__add">
          <input type="file" name="images" multiple accept="image/*" class="spr-images__input">
          <span class="material-symbols-outlined">photo_camera</span>
          <span class="spr-images__add-text">이미지 등록</span>
        </label>

        <!-- 미리보기 슬롯 (UI용 더미) -->
        <div class="spr-images__preview">
          <div class="spr-images__thumb spr-images__thumb--primary">
            <img src="" alt="preview" class="spr-images__thumb-img">
            <span class="spr-images__badge">대표</span>
            <button type="button" class="spr-images__remove" aria-label="remove">
              <span class="material-symbols-outlined">close</span>
            </button>
          </div>

          <div class="spr-images__thumb">
            <img src="" alt="preview" class="spr-images__thumb-img">
            <button type="button" class="spr-images__remove" aria-label="remove">
              <span class="material-symbols-outlined">close</span>
            </button>
          </div>
        </div>
      </div>

      <p class="spr-help">
        <span class="material-symbols-outlined">info</span>
        상품 이미지는 최대 10장까지 등록 가능합니다.
      </p>
    </section>

    <hr class="spr-divider">

    <!-- ===============================
         Title
    =============================== -->
    <section class="spr-section">
      <label class="spr-section__title" for="productTitle">제목</label>
      <input id="productTitle" name="title" type="text" class="spr-input"
             placeholder="상품 제목을 입력해주세요">
    </section>

    <hr class="spr-divider">

    <!-- ===============================
         Category (Main + Sub)
    =============================== -->
    <section class="spr-section">
      <h2 class="spr-section__title">카테고리</h2>

      <!-- 메인 카테고리 -->
      <div class="spr-category">
        <div class="spr-category__main">
          <button type="button" class="spr-chip spr-chip--active">디지털기기</button>
          <button type="button" class="spr-chip">생활가전</button>
          <button type="button" class="spr-chip">가구/인테리어</button>
          <button type="button" class="spr-chip">유아동</button>
          <button type="button" class="spr-chip">의류</button>
          <button type="button" class="spr-chip">생활/가공식품</button>
          <button type="button" class="spr-chip">스포츠/레저</button>
          <button type="button" class="spr-chip">취미/게임/음반</button>
          <button type="button" class="spr-chip">뷰티/미용</button>
          <button type="button" class="spr-chip spr-chip--muted">더보기 +</button>
        </div>

        <!-- 서브 카테고리 박스 -->
        <div class="spr-category__sub-box">
          <p class="spr-category__sub-title">디지털기기 상세 카테고리</p>
          <div class="spr-category__sub">
            <button type="button" class="spr-subchip">모바일</button>
            <button type="button" class="spr-subchip">노트북/PC</button>
            <button type="button" class="spr-subchip">카메라/광학기기</button>
            <button type="button" class="spr-subchip">음향가전</button>
            <button type="button" class="spr-subchip">게임기기</button>
          </div>
        </div>

        <!-- 값 전송용 (나중에 JS/서버 바인딩용) -->
        <input type="hidden" name="categoryMain" value="디지털기기">
        <input type="hidden" name="categorySub" value="">
      </div>
    </section>

    <hr class="spr-divider">

    <!-- ===============================
         Condition
    =============================== -->
    <section class="spr-section">
      <h2 class="spr-section__title">상품 상태</h2>

      <div class="spr-radio">
        <label class="spr-radio__item">
          <input type="radio" name="condition" value="NEW" class="spr-radio__input">
          <span class="spr-radio__text">새 상품 (미사용)</span>
        </label>

        <label class="spr-radio__item">
          <input type="radio" name="condition" value="TOP" class="spr-radio__input" checked>
          <span class="spr-radio__text">사용감 없음 (최상)</span>
        </label>

        <label class="spr-radio__item">
          <input type="radio" name="condition" value="GOOD" class="spr-radio__input">
          <span class="spr-radio__text">사용감 적음 (좋음)</span>
        </label>

        <label class="spr-radio__item">
          <input type="radio" name="condition" value="NORMAL" class="spr-radio__input">
          <span class="spr-radio__text">사용감 많음 (보통)</span>
        </label>
      </div>
    </section>

    <hr class="spr-divider">

    <!-- ===============================
         Price
    =============================== -->
    <section class="spr-section">
      <div class="spr-section__row">
        <label class="spr-section__title" for="price">가격</label>

        <!-- UI 버튼만 (기능은 나중에) -->
        <button type="button" class="spr-ai-btn">
          <span class="material-symbols-outlined">smart_toy</span>
          GPT 가격 추천
        </button>
      </div>

      <div class="spr-price">
        <span class="spr-price__prefix">₩</span>
        <input id="price" name="price" type="number" class="spr-input spr-input--price"
               placeholder="가격을 입력해주세요">
      </div>

      <label class="spr-check">
        <input type="checkbox" name="shippingIncluded">
        <span>배송비 포함</span>
      </label>
    </section>

    <hr class="spr-divider">

    <!-- ===============================
         Description
    =============================== -->
    <section class="spr-section">
      <label class="spr-section__title" for="detail">자세한 설명</label>
      <textarea id="detail" name="description" class="spr-textarea" rows="6"
        placeholder="상품에 대한 자세한 설명을 적어주세요. (구매 시기, 브랜드, 사용 기간, 하자 유무 등)
신뢰할 수 있는 거래를 위해 자세히 적어주세요."></textarea>

      <div class="spr-counter">
        <span>0/2000</span>
      </div>
    </section>

    <hr class="spr-divider">

    <!-- ===============================
         Transaction Type + Place
    =============================== -->
    <section class="spr-grid">
      <!-- 거래 방식 -->
      <div class="spr-panel">
        <h2 class="spr-section__title">거래 방식</h2>

        <div class="spr-tx">
          <label class="spr-tx__card spr-tx__card--active">
            <input type="radio" name="transactionType" value="DIRECT" checked>
            <div class="spr-tx__text">
              <p class="spr-tx__title">직거래</p>
              <p class="spr-tx__desc">동네 이웃과 직접 만나서 거래합니다.</p>
            </div>
            <span class="material-symbols-outlined spr-tx__icon">handshake</span>
          </label>

          <label class="spr-tx__card">
            <input type="radio" name="transactionType" value="DELIVERY">
            <div class="spr-tx__text">
              <p class="spr-tx__title">택배거래</p>
              <p class="spr-tx__desc">택배를 통해 물건을 보내고 받습니다.</p>
            </div>
            <span class="material-symbols-outlined spr-tx__icon">local_shipping</span>
          </label>
        </div>
      </div>

      <!-- 거래 희망 장소 -->
      <div class="spr-panel">
        <div class="spr-place__head">
          <h2 class="spr-section__title">거래 희망 장소</h2>
          <button type="button" class="spr-place__btn">장소 변경</button>
        </div>

        <div class="spr-place">
          <div class="spr-place__map">
            <div class="spr-place__pin">
              <span class="material-symbols-outlined">location_on</span>
              <span class="spr-place__label">강남구 역삼동</span>
            </div>
          </div>
        </div>

        <p class="spr-muted">* 직거래 선택 시, 설정한 지역 위주로 노출됩니다.</p>

        <input type="hidden" name="regionCode" value="">
        <input type="hidden" name="regionName" value="강남구 역삼동">
      </div>
    </section>

    <!-- ===============================
         Bottom Actions
    =============================== -->
    <div class="spr-actions">
      <a href="/" class="btn btn-outline spr-actions__cancel">취소</a>
      <button type="submit" class="btn btn-primary spr-actions__submit">등록하기</button>
    </div>

  </form>
</div>

</html>
