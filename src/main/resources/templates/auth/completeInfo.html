<!DOCTYPE html>
<html class="light" lang="ko">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>추가 정보 입력 - 중고장터</title>
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script src="https://cdn.portone.io/v2/browser-sdk.js"></script>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#13ec5b",
                        "background-light": "#f6f8f6",
                        "background-dark": "#102216",
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans", "Noto Sans KR", "sans-serif"],
                        "body": ["Noto Sans KR", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "1rem",
                        "xl": "1.5rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-[#111813] antialiased">
<div class="relative flex min-h-screen w-full flex-col overflow-hidden">
    <header class="flex items-center justify-between border-b border-[#f0f4f2] bg-white px-6 py-4 lg:px-20">
        <div class="flex items-center gap-4 text-[#111813]">
            <div class="size-8 text-primary">
                <svg fill="none" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
                    <path clip-rule="evenodd" d="M39.475 21.6262C40.358 21.4363 40.6863 21.5589 40.7581 21.5934C40.7876 21.655 40.8547 21.857 40.8082 22.3336C40.7408 23.0255 40.4502 24.0046 39.8572 25.2301C38.6799 27.6631 36.5085 30.6631 33.5858 33.5858C30.6631 36.5085 27.6632 38.6799 25.2301 39.8572C24.0046 40.4502 23.0255 40.7407 22.3336 40.8082C21.8571 40.8547 21.6551 40.7875 21.5934 40.7581C21.5589 40.6863 21.4363 40.358 21.6262 39.475C21.8562 38.4054 22.4689 36.9657 23.5038 35.2817C24.7575 33.2417 26.5497 30.9744 28.7621 28.762C30.9744 26.5497 33.2417 24.7574 35.2817 23.5037C36.9657 22.4689 38.4054 21.8562 39.475 21.6262ZM4.41189 29.2403L18.7597 43.5881C19.8813 44.7097 21.4027 44.9179 22.7217 44.7893C24.0585 44.659 25.5148 44.1631 26.9723 43.4579C29.9052 42.0387 33.2618 39.5667 36.4142 36.4142C39.5667 33.2618 42.0387 29.9052 43.4579 26.9723C44.1631 25.5148 44.659 24.0585 44.7893 22.7217C44.9179 21.4027 44.7097 19.8813 43.5881 18.7597L29.2403 4.41187C27.8527 3.02428 25.8765 3.02573 24.2861 3.36776C22.6081 3.72863 20.7334 4.58419 18.8396 5.74801C16.4978 7.18716 13.9881 9.18353 11.5858 11.5858C9.18354 13.988 7.18717 16.4978 5.74802 18.8396C4.58421 20.7334 3.72865 22.6081 3.36778 24.2861C3.02574 25.8765 3.02429 27.8527 4.41189 29.2403Z" fill="currentColor" fill-rule="evenodd"></path>
                </svg>
            </div>
            <h2 class="text-xl font-bold leading-tight tracking-[-0.015em] text-[#111813]">중고장터</h2>
        </div>
    </header>

    <main class="flex flex-1 items-center justify-center p-4">
        <div class="layout-content-container flex w-full max-w-[480px] flex-col">
            <div class="flex flex-col gap-6 rounded-xl bg-white p-6 shadow-sm ring-1 ring-[#e6ebe8] sm:p-10">
                <div class="flex flex-col gap-2 text-center">
                    <h1 class="text-[28px] font-bold leading-tight tracking-tight text-[#111813]">환영합니다! 🎁</h1>
                    <p class="text-sm font-normal text-[#61896f]">안전한 거래를 위해 딱 한 번만 인증이 필요해요.</p>
                </div>

				<div class="flex flex-col gap-2">
				    <p class="text-base font-medium leading-normal text-[#111813]">로그인 계정</p>
				    
				    <div class="relative">
				        <input type="text" 
				               th:value="${loginUser != null ? loginUser.email : email}"
				               disabled 
				               class="form-input h-14 w-full rounded-xl border border-[#dbe6df] bg-[#f0f4f2] p-[15px] text-base font-normal text-[#61896f] cursor-not-allowed"
				               style="user-select: none;">
				        

					<div class="flex flex-col gap-2 mt-2">
					    <p class="text-base font-medium leading-normal text-[#111813]">휴대폰 번호</p>
					    <div class="flex items-center gap-2">
					        <input id="phoneNumber" class="form-input h-14 w-full flex-1 rounded-xl border border-[#dbe6df] bg-white p-[15px] text-base font-normal text-[#111813] placeholder:text-[#61896f] focus:border-primary focus:outline-0 focus:ring-1 focus:ring-primary" type="tel" placeholder="010-0000-0000"/>
					        <button onclick="requestCert()" class="h-14 min-w-[100px] rounded-xl bg-primary px-4 text-sm font-bold text-[#102216] transition-all hover:bg-[#0fd650] active:scale-95 shadow-sm">
					            인증하기
					        </button>
					    </div>
					</div>
                </div>
				<div class="flex flex-col gap-2 mt-4">
				    <p class="text-base font-medium leading-normal text-[#111813]">비밀번호 설정</p>
				    <input id="newPassword" class="form-input h-14 w-full rounded-xl border border-[#dbe6df] bg-white p-[15px] text-base font-normal text-[#111813] placeholder:text-[#61896f] focus:border-primary focus:outline-0 focus:ring-1 focus:ring-primary" type="password" placeholder="사용하실 비밀번호를 입력해 주세요."/>
				    <input id="confirmPassword" class="form-input h-14 w-full rounded-xl border border-[#dbe6df] bg-white p-[15px] text-base font-normal text-[#111813] placeholder:text-[#61896f] focus:border-primary focus:outline-0 focus:ring-1 focus:ring-primary mt-1" type="password" placeholder="비밀번호를 한 번 더 입력해 주세요."/>
				    <p id="pwError" class="text-xs text-red-500 hidden">비밀번호가 일치하지 않아요!</p>
				</div>
                <button id="submitBtn" disabled class="mt-4 flex h-14 w-full items-center justify-center rounded-xl bg-primary px-6 text-lg font-bold text-[#102216] transition-all hover:bg-[#0fd650] active:scale-[0.98] disabled:opacity-50 disabled:grayscale disabled:cursor-not-allowed">
                    인증 완료하고 시작하기
                </button>
            </div>
        </div>
    </main>
</div>

<script>
	// 1. 숫자만 입력 가능하게 만드는 로직
	    document.getElementById('phoneNumber').addEventListener('input', function(e) {
	        this.value = this.value.replace(/[^0-9]/g, '');
	    });

	    // 2. 인증하기 버튼 클릭 시 실행되는 함수
		async function requestCert() {
		        const phoneInput = document.getElementById('phoneNumber');
		        const phoneNumber = phoneInput.value;

		        if (!phoneNumber) {
		            alert("인증받으실 휴대폰 번호를 입력해 주세요! 📱");
		            phoneInput.focus();
		            return;
		        }

		        try {
					const identityVerificationId = `id-verify-${new Date().getTime()}`;

					        const response = await PortOne.requestIdentityVerification({
					            storeId: "store-40e995f6-80d5-43c5-812a-babeaca09755", 
					            channelKey: "channel-key-d4d68a57-122c-4418-81fb-d1ed47cec331",
					            identityVerificationId: identityVerificationId,
					            identityVerificationMethod: "SMS"
					        });

					        if (response.code !== undefined) {
					            alert("인증 실패: " + response.message);
					            return;
					        }


					        alert("본인인증이 완료되었습니다. 🎉");
					        document.getElementById('submitBtn').disabled = false;
					        
					        window.latestVerificationId = identityVerificationId;

					    } catch (e) {
					        console.error(e);
					        alert("에러가 발생했습니다: " + e.message);
					    }
					}

		// '인증 완료하고 시작하기' 버튼 클릭 시
		document.getElementById('submitBtn').addEventListener('click', function() {
		    const phoneNumber = document.getElementById('phoneNumber').value;
		    const newPassword = document.getElementById('newPassword').value;
		    const confirmPassword = document.getElementById('confirmPassword').value;
		    const pwError = document.getElementById('pwError');

		    // 1. 비밀번호 일치 확인
		    if (newPassword !== confirmPassword) {
		        pwError.classList.remove('hidden');
		        document.getElementById('confirmPassword').focus();
		        return;
		    } else {
		        pwError.classList.add('hidden');
		    }

		    // 2. 비밀번호 입력 여부 확인
		    if (!newPassword) {
		        alert("앞으로 사용하실 비밀번호를 설정해 주세요! 🔐");
		        document.getElementById('newPassword').focus();
		        return;
		    }

		    // 3. 서버로 전송
		    fetch('/auth/update-phone', {
		        method: 'POST',
		        headers: {
		            'Content-Type': 'application/json'
		        },
		        body: JSON.stringify({
		            phoneNumber: phoneNumber,
		            password: newPassword
		        }),
		        credentials: 'include'
		    })
		    .then(response => response.text())
		    .then(data => {
		        if (data === "success") {
		            alert("환영합니다! 회원가입 정보가 업데이트되었습니다. 😊");
		            location.href = "/";
		        } else {
		            alert("정보 업데이트에 실패했어요. 다시 시도해 주세요.");
		        }
		    })
		    .catch(error => {
		        console.error('Error:', error);
		        alert("통신 중 오류가 발생했습니다.");
		    });
		});
</script>
</body>
</html>
