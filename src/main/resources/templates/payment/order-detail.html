<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">

<th:block th:fragment="pageCss">
    <link rel="stylesheet" href="/css/payment/finish.css">
</th:block>

<th:block th:fragment="pageJs">
    </th:block>

<div layout:fragment="content">  
    <header class="header">
        <div class="header-content">
            <button class="back-button" th:onclick="|location.href='@{/}'|">
                <span class="material-symbols-outlined">arrow_back</span>
            </button>
            <h1 style="font-size: 1.125rem; font-weight: 700;">구매 내역 확인</h1>
        </div>
    </header>
    
    <main class="container"> 
        <div class="card">
            <div class="product-section">
                <img th:src="${order.product.mainImageUrl ?: '/images/default-product.png'}" alt="상품이미지" class="product-img">
                <div>
                    <span class="badge" th:text="${order.escrowStatus}">상태</span>
                    <h4 class="product-title" th:text="${order.product.productName}">상품명</h4>
                    <div style="font-weight: 700; font-size: 1.125rem;">
                        <span th:text="${#numbers.formatInteger(order.totalAmount, 0, 'COMMA')} + '원'">0원</span>
                        <span style="color: #9ca3af; font-size: 0.875rem; font-weight: 400;">・ 1개</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="card" style="padding: 0;">
            <div style="padding: 1.5rem; border-bottom: 1px dashed #eee;">
                <h3 class="info-title">
                    <span class="material-symbols-outlined" style="color:#9ca3af">list_alt</span> 주문 정보
                </h3>
                <div class="info-row">
                    <span class="label">주문 번호</span>
                    <span class="value" style="font-family: monospace;" th:text="${order.orderId}">ORDER_ID</span>
                </div>
                <div class="info-row">
                    <span class="label">주문 일시</span>
                    <span class="value" th:text="${#temporals.format(order.createdAt, 'yyyy. MM. dd. HH:mm')}">2026. 01. 27</span>
                </div>
                <div class="info-row" style="margin-bottom: 0;">
                    <span class="label">결제 수단</span>
                    <span class="value" th:text="${order.paymentType.name() == 'REPAY' ? 'RE:PAY (머니)' : '일반 결제'}">결제수단</span>
                </div>
            </div>
            
            <div style="padding: 1.5rem;">
                <h3 class="info-title">
                    <span class="material-symbols-outlined" style="color:#9ca3af">local_shipping</span> 배송 정보
                </h3>
                <div class="info-row">
                    <span class="label">받는 분</span>
                    <span class="value" th:text="${order.buyer.nickname}">구매자</span>
                </div>
                <div class="info-row">
                    <span class="label">연락처</span>
                    <span class="value">정보 없음</span>
                </div>
                <div class="info-row" style="margin-bottom: 0; align-items: flex-start;">
                    <span class="label">배송지</span>
                    <span class="value address-value">
                        <span>기본 배송지로 배송 예정</span><br>
                        <span style="color: #9ca3af; font-size: 0.825rem;">(상세 주소 데이터가 엔티티에 없습니다)</span>
                    </span>
                </div>
            </div>
        </div>

        <div class="card">
            <h3 class="info-title">
                <span class="material-symbols-outlined" style="color:#9ca3af">payments</span> 결제 금액
            </h3>
            <div class="info-row">
                <span class="label">상품 금액</span>
                <span class="value" th:text="${#numbers.formatInteger(order.product.price, 0, 'COMMA') + '원'}">0원</span>
            </div>
            <div class="info-row">
                <span class="label">배송비</span>
                <span class="value">0원</span> 
            </div>
            <div class="total-row">
                <span style="font-weight: 700;">최종 결제 금액</span>
                <span class="total-price" th:text="${#numbers.formatInteger(order.totalAmount, 0, 'COMMA') + '원'}">0원</span>
            </div>
        </div>

        <div class="button-group">
            <button class="btn btn-white" th:onclick="|location.href='@{/}'|">메인으로 돌아가기</button>
            <button class="btn btn-primary" th:onclick="|location.href='@{/chat/room(productId=${order.product.productId})}'|">
                <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">chat</span>
                판매자에게 채팅하기
            </button>
        </div>
    </main>
</div>
</html>
