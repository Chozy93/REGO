<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">

<div layout:fragment="content">

  <!-- =========================
       CATEGORY BAR
  ========================= -->
  <section class="category-bar">
    <h2 class="category-title"
        th:text="${page.categoryBar.categoryName}">
      카테고리명
    </h2>

    <ul class="category-tabs">
      <li th:each="tab : ${page.categoryBar.tabs}"
          th:classappend="${tab.active} ? 'active'">

        <a th:href="@{/products(categoryId=${tab.id})}"
           th:text="${tab.name}">
          탭명
        </a>

      </li>
    </ul>
  </section>

  <!-- =========================
       PRODUCT LIST
  ========================= -->
  <section class="product-list">

    <!-- 상품 없음 -->
    <div th:if="${#lists.isEmpty(page.cards)}"
         class="empty-message">
      등록된 상품이 없습니다.
    </div>

    <!-- 상품 카드 -->
    <div class="product-grid"
         th:if="${!#lists.isEmpty(page.cards)}">

      <div class="product-card"
           th:each="card : ${page.cards}">

        <a th:href="@{/products/{id}(id=${card.id})}">

          <img th:src="${card.img}"
               alt="상품 이미지"/>

          <div class="info">
            <p class="title" th:text="${card.title}">상품명</p>
            <p class="price"
               th:text="${#numbers.formatInteger(card.price, 3, 'COMMA')} + '원'">
              가격
            </p>
            <p class="meta">
              <span th:text="${card.loc}">지역</span>
              ·
              <span th:text="${card.time}">시간</span>
            </p>
          </div>

        </a>

        <!-- 찜 -->
        <button class="like-btn"
                th:classappend="${card.liked} ? 'liked'">
          ♥ <span th:text="${card.likeCount}">0</span>
        </button>

      </div>
    </div>

  </section>

</div>
</html>
