<!DOCTYPE html>
<html class="light" lang="ko">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Sign Up Information - RE: GO</title>
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
	<script src="https://cdn.portone.io/v2/browser-sdk.js"></script>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#13ec5b",
                        "background-light": "#f6f8f6",
                        "background-dark": "#102216",
                        "surface-light": "#ffffff",
                        "surface-dark": "#182c20",
                        "text-main": "#111813",
                        "text-muted": "#61896f",
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans", "Noto Sans KR", "sans-serif"],
                        "body": ["Plus Jakarta Sans", "Noto Sans KR", "sans-serif"],
                    },
                    borderRadius: {"DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px"},
                },
            },
        }
    </script>
    <style>
        .form-input {
            width: 100%;
            height: 3rem;
            border-radius: 0.5rem;
            border-width: 1px;
            padding-left: 1rem;
            padding-right: 1rem;
            font-size: 1rem;
            line-height: 1.5;
            transition: all 0.2s;
            outline: none;
        }
        .form-input:focus {
            border-color: #13ec5b;
            box-shadow: 0 0 0 1px #13ec5b;
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-text-main dark:text-white transition-colors duration-200">
<div class="relative flex min-h-screen w-full flex-col overflow-x-hidden">
    <header class="flex items-center justify-between whitespace-nowrap px-6 lg:px-10 py-6 w-full bg-transparent">
        <div class="flex items-center gap-4 text-text-main dark:text-white cursor-pointer w-full">
            <a class="text-text-muted dark:text-gray-400 text-sm font-medium leading-normal hover:text-primary transition-colors flex items-center gap-1" href="/login">
                <span class="material-symbols-outlined text-lg">arrow_back</span>
                로그인으로 돌아가기
            </a>
        </div>
    </header>
    
    <div class="layout-container flex h-full grow flex-col">
        <div class="flex flex-1 justify-center py-4 px-4 sm:px-6">
            <div class="layout-content-container flex flex-col w-full max-w-[480px] flex-1">
                <div class="flex flex-col items-center justify-center mb-8">
                    <div class="mb-4 flex h-16 w-16 items-center justify-center rounded-full bg-surface-light dark:bg-surface-dark shadow-sm border border-[#f0f4f2] dark:border-[#1f3629]">
                        <span class="text-2xl font-black italic text-primary">RE</span>
                    </div>
                    <p class="text-sm font-medium text-text-muted dark:text-gray-400">새로운 시작, RE: GO와 함께</p>
                </div>
                
                <div class="flex flex-col gap-3 mb-8">
                    <div class="flex gap-6 justify-between items-end">
                        <span class="text-xs font-medium text-text-muted dark:text-gray-400">정보입력</span>
                        <span class="text-xs font-medium text-primary">2/3</span>
                    </div>
                    <div class="rounded-full bg-[#dbe6df] dark:bg-[#1f3629] h-2 overflow-hidden">
                        <div class="h-full rounded-full bg-primary transition-all duration-500 ease-out" style="width: 66%;"></div>
                    </div>
                </div>

                <div class="mb-8 text-center sm:text-left">
                    <h1 class="text-text-main dark:text-white tracking-tight text-[28px] sm:text-[32px] font-bold leading-tight">
                        기본 정보를 입력해주세요
                    </h1>
                    <p class="mt-3 text-sm text-text-muted dark:text-gray-400">
                        정확한 정보를 입력하여 회원가입을 완료해주세요.
                    </p>
                </div>

                <form action="/signup/step2" method="post">
                    <div class="flex flex-col gap-5">
                        
                        <div class="flex flex-col gap-1.5">
                            <label class="text-sm font-bold text-text-main dark:text-white">이메일</label>
                            <div class="flex gap-2">
                                <input class="form-input bg-surface-light dark:bg-surface-dark border-[#dbe6df] dark:border-[#2a4032] text-text-main dark:text-white" 
                                       placeholder="example@re-go.com" type="email" name="email" required/>
									   <button id="checkEmailBtn" class="whitespace-nowrap px-4 rounded-lg border border-[#dbe6df] dark:border-[#2a4032] bg-surface-light dark:bg-surface-dark font-medium text-sm" type="button">중복확인</button>
                            </div>
							<span id="emailMessage" class="text-xs mt-1 px-1"></span>
                        </div>

                        <div class="flex flex-col gap-1.5">
                            <label class="text-sm font-bold text-text-main dark:text-white">비밀번호</label>
                            <input class="form-input bg-surface-light dark:bg-surface-dark border-[#dbe6df] dark:border-[#2a4032] text-text-main dark:text-white" 
                                   placeholder="영문, 숫자, 특수문자 포함 8자 이상" type="password" name="password" required/>
                        </div>
						<div class="flex flex-col gap-1.5">
						                           <label class="text-sm font-bold text-text-main dark:text-white">비밀번호 확인</label>
						                           <input id="passwordConfirm" class="form-input bg-surface-light dark:bg-surface-dark border-[#dbe6df] dark:border-[#2a4032] text-text-main dark:text-white" 
						                                  placeholder="비밀번호를 한 번 더 입력해주세요" type="password" required/>
														  <span id="pwMessage" class="text-xs mt-1 px-1"></span>
						                       </div>
                        <div class="flex flex-col gap-1.5">
                            <label class="text-sm font-bold text-text-main dark:text-white">닉네임</label>
                            <input id="nickname" class="form-input bg-surface-light dark:bg-surface-dark border-[#dbe6df] dark:border-[#2a4032] text-text-main dark:text-white" 
                                   placeholder="닉네임을 입력해주세요" type="text" name="nickname" required/>
								   <span id="nicknameError" class="text-xs mt-1 px-1"></span>
                        </div>

                        <div class="flex flex-col gap-1.5">
                            <label class="text-sm font-bold text-text-main dark:text-white">이름</label>
                            <input id="username" class="form-input bg-surface-light dark:bg-surface-dark border-[#dbe6df] dark:border-[#2a4032] text-text-main dark:text-white" 
                                   placeholder="실명을 입력해주세요" type="text" name="username" required/>
                        </div>

                        <div class="flex flex-col gap-1.5">
                            <label class="text-sm font-bold text-text-main dark:text-white">휴대폰 번호</label>
                            <div class="flex gap-2">
                                <input class="form-input bg-surface-light dark:bg-surface-dark border-[#dbe6df] dark:border-[#2a4032] text-text-main dark:text-white" 
                                       placeholder="- 없이 숫자만 입력" type="tel" name="phoneNumber" required/>
									   <button id="sendAuthBtn" 
									           class="whitespace-nowrap px-4 rounded-lg border border-[#dbe6df] dark:border-[#2a4032] bg-surface-light dark:bg-surface-dark font-medium text-sm opacity-50 cursor-not-allowed" 
									           type="button" disabled>
									       본인인증 하기
									   </button>
                            </div>
							<p class="text-[11px] text-blue-500 dark:text-blue-400 mt-1 pl-1">
							    ℹ️ 본인인증 완료 시 회원 정보가 자동 갱신됩니다.
							</p>
                        </div>
						
                        <div class="flex flex-col gap-1.5">
                            <label class="text-sm font-bold text-text-main dark:text-white">성별</label>
                            <div class="flex gap-2">
                                <label class="flex-1 cursor-pointer">
                                    <input class="peer sr-only" name="gender" type="radio" value="M"/>
                                    <div class="h-12 flex items-center justify-center rounded-lg border border-[#dbe6df] dark:border-[#2a4032] peer-checked:border-primary peer-checked:text-primary transition-all font-medium text-sm">남성</div>
                                </label>
                                <label class="flex-1 cursor-pointer">
                                    <input class="peer sr-only" name="gender" type="radio" value="F"/>
                                    <div class="h-12 flex items-center justify-center rounded-lg border border-[#dbe6df] dark:border-[#2a4032] peer-checked:border-primary peer-checked:text-primary transition-all font-medium text-sm">여성</div>
                                </label>
                            </div>
                        </div>

                        <div class="flex flex-col gap-1.5">
                            <label class="text-sm font-bold text-text-main dark:text-white">생년월일</label>
                            <input class="form-input bg-surface-light dark:bg-surface-dark border-[#dbe6df] dark:border-[#2a4032] text-text-main dark:text-white" 
                                   maxlength="8" placeholder="생년월일 8자리 (예: 19990101)" type="text" name="birthDate"/>
                        </div>
                    </div>

                    <div class="mt-8">
                        <button type="submit" class="flex w-full cursor-pointer items-center justify-center overflow-hidden rounded-xl h-14 px-5 bg-primary hover:bg-[#0fd951] active:scale-[0.98] transition-all duration-200 text-[#111813] text-base font-bold shadow-lg">
                            <span class="truncate">가입 완료</span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
        
        <footer class="py-6 text-center">
            <p class="text-text-muted dark:text-gray-600 text-xs font-medium">© 2024 RE: GO. All rights reserved.</p>
        </footer>
    </div>
</div>
<script>
	let isEmailVerified = false; 
	    let isAuthVerified = false;  

	    const signupForm = document.querySelector('form');
	    const emailInput = document.querySelector('input[name="email"]');
	    const emailMessage = document.getElementById('emailMessage');
	    const passwordInput = document.querySelector('input[name="password"]');
	    const passwordConfirm = document.getElementById('passwordConfirm');
	    const pwMessage = document.getElementById('pwMessage');
	    const nameInput = document.getElementById('username');
	    const nicknameInput = document.getElementById('nickname');
	    const nicknameError = document.getElementById('nicknameError');
	    const phoneInput = document.querySelector('input[name="phoneNumber"]');
	    const birthInput = document.querySelector('input[name="birthDate"]');
	    const sendAuthBtn = document.getElementById('sendAuthBtn');

		function formatPhoneNumber(numbers) {
							    if (!numbers) return "";
							    let val = numbers.replace(/[^0-9]/g, '');
							    if (val.length <= 3) return val;
							    if (val.length <= 7) return val.slice(0, 3) + '-' + val.slice(3);
							    return val.slice(0, 3) + '-' + val.slice(3, 7) + '-' + val.slice(7, 11);
							}
	    // 1. 이메일 중복 확인
	    document.getElementById('checkEmailBtn').addEventListener('click', () => {
	        const email = emailInput.value;
	        if(!email) {
	            emailMessage.textContent = "이메일을 먼저 입력해 주세요.";
	            emailMessage.style.color = "red";
	            return;
	        }
	        fetch(`/signup/check-email?email=${email}`)
	            .then(res => res.json())
	            .then(isTaken => {
	                if(isTaken) {
	                    emailMessage.textContent = "이미 사용 중인 이메일이에요. ㅠㅠ";
	                    emailMessage.style.color = "red";
	                    isEmailVerified = false;
	                } else {
	                    emailMessage.textContent = "사용 가능합니다. 😊";
	                    emailMessage.style.color = "#13ec5b";
	                    isEmailVerified = true;
	                }
	            });
	    });

	    emailInput.addEventListener('input', () => {
	        isEmailVerified = false;
	        emailMessage.textContent = "수정 시 다시 중복 확인을 해주세요.";
	        emailMessage.style.color = "orange";
	    });

	    // 2. 비밀번호 실시간 체크
	    const checkPasswords = () => {
	        const pw = passwordInput.value;
	        const pw2 = passwordConfirm.value;
	        if (pw.length > 0 && pw.length < 8) {
	            pwMessage.textContent = "비밀번호는 최소 8자리 이상이어야 해요! ❌";
	            pwMessage.style.color = "red";
	            return false;
	        }
	        if (pw2.length > 0) {
	            if (pw === pw2) {
	                pwMessage.textContent = "비밀번호가 일치하고 안전합니다. ✅";
	                pwMessage.style.color = "#13ec5b";
	                return true;
	            } else {
	                pwMessage.textContent = "비밀번호가 일치하지 않아요. ❌";
	                pwMessage.style.color = "red";
	                return false;
	            }
	        } else {
	            pwMessage.textContent = "";
	            return pw.length >= 8;
	        }
	    };
	    passwordInput.addEventListener('input', checkPasswords);
	    passwordConfirm.addEventListener('input', checkPasswords);

	    // 3. 이름(username) 관리
	    nameInput.addEventListener('input', (e) => {
	        e.target.value = e.target.value.replace(/[^ㄱ-ㅎㅏ-ㅣ가-힣]/g, '');
	    });

	    // 4. 닉네임 실시간 중복 체크
	    nicknameInput.addEventListener('input', () => {
	        const nickname = nicknameInput.value.trim();
	        if (!nickname) {
	            nicknameError.textContent = "";
	            return;
	        }
	        if (nickname.length < 2) {
	            nicknameError.textContent = "닉네임은 최소 2자 이상 작성해주세요";
	            nicknameError.style.color = "red";
	            return;
	        }

	        fetch(`/signup/check-nickname?nickname=${encodeURIComponent(nickname)}`)
	            .then(res => res.json())
	            .then(isTaken => {
	                // 서버에서 오는 값이 true/false인지 확실히 체크
	                if (isTaken === true) {
	                    nicknameError.textContent = "이미 사용중인 닉네임 입니다.";
	                    nicknameError.style.color = "red";
	                } else {
	                    nicknameError.textContent = "사용가능한 닉네임 입니다!";
	                    nicknameError.style.color = "green";
	                }
	            })
	            .catch(err => console.error("서버 통신 에러!", err));
	    });

	    // 5. 휴대폰 인증 및 하이픈 자동 삽입
		sendAuthBtn.addEventListener('click', async () => {
			if (phoneInput.value.replace(/[^0-9]/g, '').length !== 11) {
			        alert("휴대폰 번호 11자리를 정확히 입력해 주세요!");
			        return;
			    }
			    
			    try
		    {
		        const identityVerificationId = `signup-${new Date().getTime()}`;

		        // 포트원 V2 본인인증 요청
		        const response = await PortOne.requestIdentityVerification({
		            storeId: "store-40e995f6-80d5-43c5-812a-babeaca09755", 
		            channelKey: "channel-key-d4d68a57-122c-4418-81fb-d1ed47cec331",
		            identityVerificationId: identityVerificationId,
		            identityVerificationMethod: "SMS"
		        });

		        if (response.code == null) {
		            // 인증 성공 시 서버로 검증 요청
		            const res = await fetch("/signup/verify-identity", {
		                method: "POST",
		                headers: { "Content-Type": "application/json" },
		                body: JSON.stringify({ identityVerificationId: response.identityVerificationId })
		            });

		            const data = await res.json();
					
					if (data.success) {
					    alert("본인인증 성공! 정보를 자동으로 입력합니다. 😊");
					    
					    nameInput.value = data.name;
					    nameInput.readOnly = true;
					    
					    phoneInput.value = formatPhoneNumber(data.phone);
					    phoneInput.readOnly = true;
					    
					    // 생일 (
					    if(data.birthDate) {
					        birthInput.value = data.birthDate.replace(/-/g, ''); 
					        birthInput.readOnly = true;
					    }
					    
					    // 성별 (MALE -> M, FEMALE -> F)
					    if(data.gender) {
					        const genderValue = data.gender === 'MALE' ? 'M' : 'F';
					        const radio = document.querySelector(`input[name="gender"][value="${genderValue}"]`);
					        if(radio) radio.checked = true;
					    }
						phoneInput.readOnly = true;
						
					    isAuthVerified = true;
					    sendAuthBtn.disabled = true;
					    sendAuthBtn.innerText = "인증 완료";
					    sendAuthBtn.classList.add('opacity-50', 'cursor-not-allowed'); 
		            } else {
		                alert(data.message || "이미 가입된 번호이거나 인증에 실패했습니다.");
		            }
		        }
		    } catch (error) {
		        alert("본인인증 중 오류 발생: " + error.message);
		    }
		});

		phoneInput.addEventListener('input', (e) => {
		    e.target.value = formatPhoneNumber(e.target.value);
		    
		    const rawValue = e.target.value.replace(/[^0-9]/g, '');
		    
		    if (rawValue.length === 11) {

		        sendAuthBtn.disabled = false;
		        sendAuthBtn.classList.remove('opacity-50', 'cursor-not-allowed');
		        sendAuthBtn.classList.add('hover:bg-primary', 'hover:text-white');
		    } else {
		        sendAuthBtn.disabled = true;
		        sendAuthBtn.classList.add('opacity-50', 'cursor-not-allowed');
		        sendAuthBtn.classList.remove('hover:bg-primary', 'hover:text-white');
		    }
		});
		
	    // 6. 최종 전송 시 유효성 검사 
	    signupForm.addEventListener('submit', (e) => {
	        console.log("가입 제출 시도 중...");
			if (phoneInput) {
			        phoneInput.value = phoneInput.value.replace(/[^0-9]/g, '');
			    }
	        const birthReg = /^(19|20)\d{2}(0[1-9]|1[0-2])(0[1-9]|[12]\d|3[01])$/;
	        const nameRegex = /^[가-힣]{2,5}$/; 
	        const nameValue = nameInput.value;
	        const genderSelected = document.querySelector('input[name="gender"]:checked');

	        if (!isEmailVerified) { e.preventDefault(); alert("이메일 중복 확인이 필요해요!"); return; }
	        if (!checkPasswords()) { e.preventDefault(); alert("비밀번호를 확인해 주세요!"); return; }
	        
	        // 이름 빌런 차단 (오타 수정된 부분!)
	        if (!nameRegex.test(nameValue)) {
	            alert("이름은 완성된 한글 2~5자리로 입력해주세요! (꿻꿻 금지)");
	            e.preventDefault();
	            nameInput.focus();
	            return;
	        }
	        
	        if (!isAuthVerified) { e.preventDefault(); alert("휴대폰 인증을 완료해 주세요!"); return; }
	        if (!genderSelected) { e.preventDefault(); alert("성별을 선택해 주세요!"); return; }
	        if (!birthReg.test(birthInput.value)) {
	            e.preventDefault();
	            alert("생년월일 8자리를 정확히 입력해 주세요 (예: 19950520).");
	            return;
	        }
	    });
	</script>
</body>
</html>
