<html xmlns:th="http://www.thymeleaf.org">
<div th:fragment="region-modal" id="regionModal" class="modal-overlay" style="display: none;">
    <div class="modal-container">
        <div class="modal-header">
            <h2 class="modal-title">지역 설정</h2>
            <button type="button" class="close-btn" onclick="closeRegionModal()">
                <span class="material-symbols-outlined">close</span>
            </button>
        </div>

        <div class="search-section">
            <div class="search-input-wrapper">
                <span class="material-symbols-outlined search-icon">search</span>
                <input type="text" class="search-input" placeholder="지역명을 검색하세요">
            </div>
        </div>

        <button type="button" class="current-location-btn">
            <div class="location-icon-circle">
                <span class="material-symbols-outlined">near_me</span>
            </div>
            <div class="location-text-group">
                <span class="location-main-text">현재 위치로 설정</span>
                <span class="location-sub-text">GPS를 이용하여 위치를 찾습니다</span>
            </div>
        </button>

        <div class="region-list" id="regionDataContainer">
            <p class="initial-text" style="text-align:center; padding:20px; color:#888;">지역명을 입력해주세요.</p>
            </div>

        <div class="modal-footer">
            <p class="footer-text">지역을 설정하면 해당 지역의 상품만 볼 수 있습니다</p>
        </div>
    </div>
</div>
</html>
