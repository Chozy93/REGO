
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RE:PAY 비밀번호 설정</title>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    
    <style>
        /* [CSS] 기본 스타일 정의 */
        :root {
            --primary-color: #13ec5b;
            --bg-color: #f6f8f6;
            --text-color: #111813;
            --sub-text-color: #61896f;
            --border-color: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Manrope', 'Noto Sans KR', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* 메인 컨테이너 */
        .container {
            width: 100%;
            max-width: 480px;
            padding: 20px;
            text-align: center;
        }

        /* 아이콘 및 텍스트 영역 */
        .header-section {
            margin-bottom: 40px;
        }

        .icon-box {
            width: 64px;
            height: 64px;
            background-color: rgba(19, 236, 91, 0.1);
            border-radius: 16px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 24px;
        }

        .icon-box span {
            color: var(--primary-color);
            font-size: 32px;
        }

        h2 {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 12px;
        }

        p {
            color: var(--sub-text-color);
            font-size: 16px;
            line-height: 1.6;
            font-weight: 500;
        }

        /* 비밀번호 점 (Dots) 영역 */
        .pin-container {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-bottom: 50px;
        }

        .pin-dot {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            border: 2px solid var(--border-color);
            background-color: transparent;
            transition: all 0.2s ease;
        }

        .pin-dot.filled {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
            transform: scale(1.1);
        }

        /* 키패드 영역 */
        .keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .keypad-btn {
            height: 70px;
            border: 1px solid var(--border-color);
            background-color: white;
            border-radius: 16px;
            font-size: 24px;
            font-weight: bold;
            color: var(--text-color);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.1s;
            user-select: none; /* 드래그 방지 */
        }

        .keypad-btn:active {
            background-color: #f0f4f2;
            transform: scale(0.98);
        }

        .keypad-btn.empty {
            border: none;
            background-color: transparent;
            cursor: default;
        }
        
        .keypad-btn.empty:active {
            transform: none;
        }

        /* 하단 보안 문구 */
        .footer-secure {
            margin-top: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            color: #94a3b8;
            font-size: 12px;
        }

        /* 모바일 대응 */
        @media (max-width: 400px) {
            .keypad-btn {
                height: 60px;
                font-size: 20px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-section">
            <div class="icon-box">
                <span class="material-symbols-outlined">lock</span>
            </div>
            <h2>RE:PAY 비밀번호 설정</h2>
            <p>
                RE:PAY 결제 시 사용할<br>
                비밀번호 6자리를 입력해주세요
            </p>
        </div>

        <div class="pin-container">
            <div class="pin-dot" id="dot-1"></div>
            <div class="pin-dot" id="dot-2"></div>
            <div class="pin-dot" id="dot-3"></div>
            <div class="pin-dot" id="dot-4"></div>
            <div class="pin-dot" id="dot-5"></div>
            <div class="pin-dot" id="dot-6"></div>
        </div>

        <form id="passwordForm" action="/pay/create-wallet" method="post">
            <input type="hidden" name="payPassword" id="hiddenPassword">
        </form>

        <div class="keypad">
            <button type="button" class="keypad-btn" onclick="addNumber(1)">1</button>
            <button type="button" class="keypad-btn" onclick="addNumber(2)">2</button>
            <button type="button" class="keypad-btn" onclick="addNumber(3)">3</button>
            <button type="button" class="keypad-btn" onclick="addNumber(4)">4</button>
            <button type="button" class="keypad-btn" onclick="addNumber(5)">5</button>
            <button type="button" class="keypad-btn" onclick="addNumber(6)">6</button>
            <button type="button" class="keypad-btn" onclick="addNumber(7)">7</button>
            <button type="button" class="keypad-btn" onclick="addNumber(8)">8</button>
            <button type="button" class="keypad-btn" onclick="addNumber(9)">9</button>
            
            <div class="keypad-btn empty"></div> <button type="button" class="keypad-btn" onclick="addNumber(0)">0</button>
            <button type="button" class="keypad-btn" onclick="removeNumber()">
                <span class="material-symbols-outlined">backspace</span>
            </button>
        </div>

        <div class="footer-secure">
            <span class="material-symbols-outlined" style="font-size: 16px;">verified_user</span>
            <span>보안 키패드가 작동 중입니다</span>
        </div>
    </div>

    <script>
        // [JavaScript] 비밀번호 로직
        let currentPassword = ""; // 입력된 비밀번호 저장 변수
        const maxLength = 6;      // 최대 길이

        // 숫자 클릭 시
        function addNumber(num) {
            if (currentPassword.length < maxLength) {
                currentPassword += num;
                updateDots();

                // 6자리가 모두 채워졌을 때
                if (currentPassword.length === maxLength) {
                    submitPassword();
                }
            }
        }

        // 지우기(Backspace) 클릭 시
        function removeNumber() {
            if (currentPassword.length > 0) {
                currentPassword = currentPassword.slice(0, -1);
                updateDots();
            }
        }

        // 화면의 점(Dot) 상태 업데이트
        function updateDots() {
            for (let i = 1; i <= maxLength; i++) {
                const dot = document.getElementById('dot-' + i);
                if (i <= currentPassword.length) {
                    dot.classList.add('filled'); // 색칠하기
                } else {
                    dot.classList.remove('filled'); // 비우기
                }
            }
        }

        // 폼 전송
        function submitPassword() {
            // 약간의 딜레이 후 전송 (사용자가 6번째 점이 채워지는 것을 볼 수 있게)
            setTimeout(() => {
                const form = document.getElementById('passwordForm');
                const hiddenInput = document.getElementById('hiddenPassword');
                
                hiddenInput.value = currentPassword; // 숨겨진 input에 값 넣기
                form.submit(); // 서버로 전송
            }, 200);
        }
    </script>
</body>
</html>
