<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">

<th:block th:fragment="pageCss">
  <link rel="stylesheet" href="/css/customer/customer.css">
  <link rel="stylesheet" href="/css/customer/notice.css">
  <link rel="stylesheet" href="/css/customer/sidebar.css">
</th:block>

<div layout:fragment="content" class="container-content">

  <div class="customer-layout">

    <!-- Sidebar -->
    <th:block th:replace="fragments/sidebar/policy-sidebar :: sidebar(currentMenu='notice')"></th:block>

    <!-- Main -->
    <main class="customer-main">

      <!-- Header -->
      <div class="customer-header">
		<a href="#" class="customer-back" onclick="history.back()">
		         <span class="material-symbols-outlined">arrow_back</span>
		       </a>
        <div>
          <h1 class="customer-title">공지사항</h1>
          <p class="customer-desc">
            RE:GO의 새로운 소식과 업데이트를 확인하세요.
          </p>
        </div>

        <div sec:authorize="hasRole('ADMIN')">
          <a th:href="@{/customer/notice-write}" class="notice-write-btn">
            <span class="material-symbols-outlined">edit</span>
            공지사항 작성
          </a>
        </div>
      </div>

      <!-- 검색 / 필터 -->
      <section class="customer-card">
        <div class="customer-card-body">

          <div class="search-box">
            <span class="material-symbols-outlined search-icon">search</span>
            <input type="text"
				   class="search-bar"
                   placeholder="제목 또는 내용으로 검색">
          </div>

          <div class="filter-tags">
            <button class="tag active">전체</button>           
            <button class="tag">이벤트</button>
            <button class="tag">서비스 점검</button>
          </div>

        </div>
      </section>

      <!-- 공지 리스트 -->
      <section class="customer-card">
        <div class="customer-card-body">

          <!-- table header -->
          <div class="list-table-header">
            <div class="col-title">공지 제목</div>
            <div class="col-date">작성일</div>
            <div class="col-views">조회수</div>
          </div>

          <ul class="notice-list">

            <!-- pinned notice -->
            <li th:each="notice : ${pinnedList}" class="notice-item pinned">
              <a th:href="@{/customer/notice-detail(id=${notice.noticeId})}">

                <div class="item-content">
                  <div class="badge-row">
                    <span class="badge badge-red">중요</span>
                    <span class="badge badge-gray"
                          th:text="${notice.category}">분류</span>
                  </div>

                  <h3 class="item-title"
                      th:text="${notice.title}">
                    상단 고정 제목
                  </h3>
                </div>

                <div class="item-info">
                  <span class="info-date"
                        th:text="${#temporals.format(notice.createdAt, 'yyyy.MM.dd')}">
                    2024.01.01
                  </span>
                  <span class="info-views"
                        th:text="${#numbers.formatInteger(notice.viewCount, 0, 'COMMA')}">
                    0
                  </span>
                </div>

              </a>
            </li>

            <!-- normal notice -->
            <li th:each="notice : ${noticeList}" class="notice-item">
              <a th:href="@{/customer/notice-detail(id=${notice.noticeId})}">

                <div class="item-content">
                  <div class="badge-row">
                    <span class="badge badge-green">공지</span>
                    <span class="badge badge-gray"
                          th:text="${notice.category}">분류</span>
                  </div>

                  <h3 class="item-title"
                      th:text="${notice.title}">
                    일반 공지 제목
                  </h3>
                </div>

                <div class="item-info">
                  <span class="info-date"
                        th:text="${#temporals.format(notice.createdAt, 'yyyy.MM.dd')}">
                    2024.01.01
                  </span>
                  <span class="info-views"
                        th:text="${#numbers.formatInteger(notice.viewCount, 0, 'COMMA')}">
                    0
                  </span>
                </div>

              </a>
            </li>

            <!-- empty -->
            <li th:if="${#lists.isEmpty(noticeList) and #lists.isEmpty(pinnedList)}"
                class="notice-item"
                style="text-align:center; padding:50px;">
              등록된 공지사항이 없습니다.
            </li>

          </ul>

          <!-- pagination -->
          <div class="pagination" th:if="${!page.isEmpty()}">

            <a th:href="@{/customer/notice(page=${page.number - 1})}"
               class="page-arrow"
               th:classappend="${page.first} ? 'disabled'">
              <span class="material-symbols-outlined">chevron_left</span>
            </a>

            <th:block th:each="i : ${#numbers.sequence(0, page.totalPages - 1)}">
              <a th:href="@{/customer/notice(page=${i})}"
                 class="page-num"
                 th:classappend="${i == page.number} ? 'active'"
                 th:text="${i + 1}">
                1
              </a>
            </th:block>

            <a th:href="@{/customer/notice(page=${page.number + 1})}"
               class="page-arrow"
               th:classappend="${page.last} ? 'disabled'">
              <span class="material-symbols-outlined">chevron_right</span>
            </a>

          </div>

        </div>
      </section>

    </main>
  </div>
  <th:block th:fragment="pageJs">
    <script src="/js/customer/notice.js"></script>
</th:block>
</div>

</html>
