<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">

<th:block th:fragment="pageCss">
    <link rel="stylesheet" href="/css/customer/notice.css">
	<link rel="stylesheet" href="/css/policy/policy.css">
</th:block>

<div layout:fragment="content" class="policy-wrapper">
	<div class="policy-container">
	        
	       <th:block th:replace="fragments/sidebar/policy-sidebar :: sidebar(currentMenu='notice')"></th:block>

	        <main class="main-content" >
	            
	            <div class="page-header flex-header">
					<div class="header-text-group">
					        <h2 class="text-3xl font-extrabold tracking-tight text-[#111813]">공지사항</h2>
					        <p class="text-gray-500">RE: GO의 새로운 소식과 업데이트를 확인하세요.</p>
					    </div>
					
					<div sec:authorize="hasRole('ADMIN')" class="header-action">
					        <a th:href="@{/customer/notice-write}" class="write-btn">
					            <span class="material-symbols-outlined">edit</span>
					            공지사항 작성
					        </a>
					    </div>
	            </div>
				


	            <div class="filter-card">
	                <div class="search-box">
	                    <span class="material-symbols-outlined search-icon">search</span>
	                    <input type="text" placeholder="제목 또는 내용으로 검색" class="search-input">
	                </div>
	                <div class="filter-tags">
	                    <button class="tag active">전체</button>
	                    <button class="tag">공지</button>
	                    <button class="tag">이벤트</button>
	                    <button class="tag">서비스 점검</button>
	                </div>
	            </div>

	            <div class="list-card">
	                <div class="list-table-header">
	                    <div class="col-title">공지 제목</div>
	                    <div class="col-date">작성일</div>
	                    <div class="col-views">조회수</div>
	                </div>

	                <ul class="notice-list">
	                    <li class="notice-item">
	                        <a href="#">
	                            <div class="item-content">
	                                <div class="badge-row">
	                                    <span class="badge badge-red">중요</span>
	                                    <span class="badge badge-gray">서비스 점검</span>
	                                </div>
	                                <h3 class="item-title">[점검] 5월 25일 새벽 시스템 정기 점검 안내 (02:00 ~ 06:00)</h3>
	                            </div>
	                            <div class="item-info">
	                                <span class="info-date">2024.05.23</span>
	                                <span class="info-views">2,451</span>
	                            </div>
	                        </a>
	                    </li>
	                    <li class="notice-item">
	                        <a href="#">
	                            <div class="item-content">
	                                <div class="badge-row">
	                                    <span class="badge badge-green">공지</span>
	                                </div>
	                                <h3 class="item-title">개인정보 처리방침 변경 안내 (시행일: 2024.06.01)</h3>
	                            </div>
	                            <div class="item-info">
	                                <span class="info-date">2024.05.20</span>
	                                <span class="info-views">1,203</span>
	                            </div>
	                        </a>
	                    </li>
	                </ul>

	                <div class="pagination">
	                    <button class="page-arrow disabled">
	                        <span class="material-symbols-outlined">chevron_left</span>
	                    </button>
	                    <button class="page-num active">1</button>
	                    <button class="page-num">2</button>
	                    <button class="page-num">3</button>
	                    <button class="page-arrow">
	                        <span class="material-symbols-outlined">chevron_right</span>
	                    </button>
	                </div>
	            </div>
	        </main>
	    </div>
</div>
</html>
