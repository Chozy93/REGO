<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">

<th:block th:fragment="pageCss">
  <link rel="stylesheet" href="/css/admin/admin-sidebar.css">
  <link rel="stylesheet" href="/css/admin/inquiry-answer.css">
</th:block>

<div layout:fragment="content" class="admin-layout">

  <th:block th:replace="fragments/admin-sidebar :: admin-sidebar('inquiries')"/>

  <div class="admin-inquiry-detail">

    <!-- 상단 -->
    <div class="detail-header">
      <span class="breadcrumb">1:1 문의 답변</span>
      <span class="status wait"
            th:text="${inquiry.status == 'WAITING' ? '답변대기' : '답변완료'}">
      </span>
    </div>

    <!-- 문의 카드 -->
    <section class="detail-card">
      <div class="card-head">
        <span class="type" th:text="${inquiry.inquiryType}"></span>
        <span class="date"
              th:text="${#temporals.format(inquiry.createdAt,'yyyy.MM.dd')}">
        </span>
      </div>

      <h2 class="title" th:text="${inquiry.title}"></h2>

      <div class="content" th:text="${inquiry.content}"></div>
    </section>

    <!-- 답변 작성 -->
    <form method="post"
          th:action="@{/admin/inquiries/{id}/answer(id=${inquiry.id})}">

      <section class="detail-card answer-write">
        <label class="answer-label">답변 내용</label>

        <textarea name="answerContent"
                  placeholder="고객에게 전달될 답변을 입력하세요"
                  required></textarea>

        <div class="answer-actions">
          <a th:href="@{/admin/inquiries}" class="btn btn-light">취소</a>
          <button type="submit" class="btn btn-primary">답변 등록</button>
        </div>
      </section>
    </form>

  </div>
</div>

</html>
