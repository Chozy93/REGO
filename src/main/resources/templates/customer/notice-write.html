<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">

<th:block th:fragment="pageCss">
    <link rel="stylesheet" href="/css/customer/notice-write.css">
	<link rel="stylesheet" href="/css/policy/policy.css">
</th:block>

<div layout:fragment="content" >
	<div class="write-wrapper">
	    <div class="write-container">
	        <header class="write-page-header">
	            <a href="/customer/notice" class="back-btn">
	                <span class="material-symbols-outlined">arrow_back</span>
	            </a>
	            <div class="header-text">
	                <h2>공지사항 작성</h2>
	                <p class="breadcrumb">관리자 페이지 &gt; 공지사항 관리</p>
	            </div>
	        </header>

	        <form class="write-card">
	            <div class="form-section">
	                <div class="form-row split">
	                    <div class="form-group flex-1">
	                        <label>분류</label>
	                        <select class="form-control">
	                            <option value="important">중요</option>
	                            <option value="maintenance">서비스 점검</option>
	                            <option value="event">이벤트</option>
	                            <option value="update">업데이트</option>
	                            <option value="general">일반</option>
	                        </select>
	                    </div>
	                    <div class="form-group flex-3">
	                        <label>제목</label>
	                        <input type="text" class="form-control" placeholder="공지사항 제목을 입력해주세요">
	                    </div>
	                </div>

	                <div class="form-group">
	                    <label>주요 안내 문구 (요약)</label>
	                    <textarea class="form-control no-resize" rows="2" placeholder="목록에 노출될 간단한 요약 문구를 입력하세요"></textarea>
	                </div>

	                <div class="form-group">
	                    <label>상세 내용</label>
	                    <div class="custom-editor">
	                        <div class="editor-toolbar">
	                            <div class="toolbar-group">
	                                <button type="button"><span class="material-symbols-outlined">format_bold</span></button>
	                                <button type="button"><span class="material-symbols-outlined">format_italic</span></button>
	                                <button type="button"><span class="material-symbols-outlined">format_underlined</span></button>
	                            </div>
	                            <div class="toolbar-divider"></div>
	                            <div class="toolbar-group">
	                                <button type="button"><span class="material-symbols-outlined">format_align_left</span></button>
	                                <button type="button"><span class="material-symbols-outlined">format_align_center</span></button>
	                                <button type="button"><span class="material-symbols-outlined">format_align_right</span></button>
	                            </div>
	                            <div class="toolbar-divider"></div>
	                            <div class="toolbar-group">
	                                <button type="button"><span class="material-symbols-outlined">image</span></button>
	                                <button type="button"><span class="material-symbols-outlined">link</span></button>
	                            </div>
	                        </div>
	                        <textarea class="editor-textarea" rows="12" placeholder="공지사항 상세 내용을 입력하세요..."></textarea>
	                    </div>
	                </div>

	                <div class="form-group">
	                    <label>첨부파일</label>
	                    <div class="file-upload-area">
	                        <div class="file-btn-wrapper">
	                            <label class="file-label">
	                                <span class="material-symbols-outlined">attach_file</span>
	                                파일 선택
	                                <input type="file" hidden multiple>
	                            </label>
	                            <span class="file-hint">최대 3개, 각 10MB 이하의 파일만 업로드 가능합니다.</span>
	                        </div>
	                        
	                        <div class="uploaded-list">
	                            <div class="file-item">
	                                <div class="file-info">
	                                    <span class="material-symbols-outlined">picture_as_pdf</span>
	                                    <span class="file-name">service_manual_v1.pdf</span>
	                                    <span class="file-size">1.2 MB</span>
	                                </div>
	                                <button type="button" class="file-remove">
	                                    <span class="material-symbols-outlined">close</span>
	                                </button>
	                            </div>
	                        </div>
	                    </div>
	                </div>
	            </div>
	        </form>

	        <div class="form-actions">
	            <button type="button" class="btn btn-secondary">취소</button>
	            <button type="submit" class="btn btn-primary">등록하기</button>
	        </div>
	    </div>
	</div>
	</div>
