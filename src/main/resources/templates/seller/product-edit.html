<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">

<th:block th:fragment="pageCss">
  <link rel="stylesheet" href="/css/seller/product-register.css">
  <link rel="stylesheet" href="/css/seller/product-region.css">
</th:block>

<div layout:fragment="content" class="seller-product-register">

  <!-- ===============================
       Page Header
       EDIT: 수정 전용
  =============================== -->
  <header class="seller-product-register__header">
    <h1 class="seller-product-register__title">상품 판매 수정</h1>
    <p class="seller-product-register__desc">
      상품 정보를 수정해 주세요.<br>
      변경 사항은 저장 후 즉시 반영됩니다.
    </p>
  </header>

  <!-- ===============================
       Form
       EDIT: th:object / action
  =============================== -->
  <form class="seller-product-register__form"
        method="post"
        th:action="@{/seller/product/edit/{id}(id=${productId})}"
        th:object="${condition}"
        enctype="multipart/form-data">

    <!-- EDIT: productId -->
    <input type="hidden" name="productId" th:value="${productId}">
    <input type="hidden" id="isEdit" value="true">

    <!-- ===============================
         Images
         EDIT: 기존 이미지 SSR + 신규 newImages
    =============================== -->
    <section class="spr-section">
      <div class="spr-section__head">
        <h2 class="spr-section__title">상품 이미지</h2>
        <span class="spr-section__meta">
          (<span id="imageCount" th:text="${#lists.size(images)}">0</span>/10)
        </span>
      </div>

      <div class="spr-images">
        <!-- 신규 이미지 -->
        <label class="spr-images__add">
          <input type="file"
                 name="newImages"
                 multiple
                 accept="image/*"
                 class="spr-images__input"
                 id="imageInput">
          <span class="material-symbols-outlined">camera_alt</span>
          <span class="spr-images__add-text">이미지 등록</span>
        </label>

        <!-- 기존 이미지 -->
        <div class="spr-images__list" id="existingImages">
          <div class="spr-image-thumb"
               th:each="img, stat : ${images}"
               th:attr="data-image-id=${img.imageId}">
            <span class="spr-image-thumb__badge" th:if="${stat.index == 0}">
              대표
            </span>
            <img th:src="${img.imageUrl}" alt="상품 이미지">
            <button type="button"
                    class="spr-image-thumb__remove btn-delete-image"
                    th:attr="data-image-id=${img.imageId}">
              ×
            </button>
          </div>
        </div>

        <!-- 신규 미리보기 -->
        <div class="spr-images__list" id="imagePreview"></div>
      </div>

      <p class="spr-help">
        <span class="material-symbols-outlined">info</span>
        상품 이미지는 최대 10장까지 등록 가능합니다.
        <strong>저장 후 첫 번째 이미지가 대표 이미지</strong>로 설정됩니다.
      </p>
    </section>

    <hr class="spr-divider">

    <!-- ===============================
         Title
         EDIT: th:field
    =============================== -->
    <section class="spr-section">
      <label class="spr-section__title" for="productTitle">제목</label>
      <input id="productTitle"
             type="text"
             class="spr-input"
             th:field="*{title}">
    </section>

    <hr class="spr-divider">

    <!-- ===============================
         Category
         EDIT: hidden 바인딩
    =============================== -->
    <section class="spr-section">
      <h2 class="spr-section__title">카테고리</h2>

      <div class="spr-category">
        <div class="spr-category__main">
          <button type="button"
                  class="spr-chip"
                  th:each="node, stat : ${headerCategoryListVO.categories}"
                  th:text="${node.parent.name}"
                  th:data-parent-id="${node.parent.categoryId}">
          </button>
        </div>

        <div class="spr-category__sub-area">
          <div class="spr-category__sub-box"
               th:each="node : ${headerCategoryListVO.categories}"
               th:data-parent-id="${node.parent.categoryId}">
            <p class="spr-category__sub-title"
               th:text="${node.parent.name} + ' 상세 카테고리'"></p>

            <div class="spr-category__sub">
              <button type="button"
                      class="spr-subchip"
                      th:each="child : ${node.children}"
                      th:text="${child.name}"
                      th:data-category-id="${child.categoryId}">
              </button>
            </div>
          </div>
        </div>

        <!-- EDIT: 기존 categoryId -->
        <input type="hidden" name="categoryId" th:value="*{categoryId}">
      </div>
    </section>

    <hr class="spr-divider">

    <!-- ===============================
         Condition
         EDIT: checked
    =============================== -->
    <section class="spr-section">
      <h2 class="spr-section__title">상품 상태</h2>

      <div class="spr-radio">
        <label class="spr-radio__item">
          <input type="radio" name="conditionStatus" value="NEW"
		  class="spr-radio__input"
                 th:checked="*{conditionStatus} == 'NEW'">
          <span class="spr-radio__text">새 상품</span>
        </label>

        <label class="spr-radio__item">
          <input type="radio" name="conditionStatus" value="LIKE_NEW"
		  class="spr-radio__input"
                 th:checked="*{conditionStatus} == 'LIKE_NEW'">
          <span class="spr-radio__text">거의 새 것</span>
        </label>

        <label class="spr-radio__item">
          <input type="radio" name="conditionStatus" value="GOOD"
		  class="spr-radio__input"
                 th:checked="*{conditionStatus} == 'GOOD'">
          <span class="spr-radio__text">사용감 있음</span>
        </label>

        <label class="spr-radio__item">
          <input type="radio" name="conditionStatus" value="FAIR"
		  class="spr-radio__input"
                 th:checked="*{conditionStatus} == 'FAIR'">
          <span class="spr-radio__text">사용감 많음</span>
        </label>
      </div>
    </section>

    <hr class="spr-divider">

    <!-- ===============================
         Price
         EDIT: th:field
    =============================== -->
    <section class="spr-section price-section">
      <div class="spr-header">
        <div class="spr-section__title">가격</div>
      </div>

      <div class="spr-price-row">
        <div class="spr-price-bottom">
          <div class="spr-price">
            <button type="button" class="spr-ai-btn">
              <span class="material-symbols-outlined">smart_toy</span>
              GPT 가격 추천 받기
            </button>

            <div class="spr-price__field">
              <span class="spr-price__prefix">₩</span>
              <input type="text"
                     class="spr-input spr-input--price"
                     th:field="*{price}">
            </div>
          </div>
        </div>

		<div class="spr-ai-info" style="display:none;">
				  <p class="spr-ai-info__title">
				    🤖 <strong>AI 중고 시세 참고</strong>
				  </p>

				  <p class="spr-ai-info__price">
				    예상 적정가: <strong><span id="aiPriceRange"></span></strong>
				  </p>
		<!--		  가격 추천 이유-->
				  <p class="spr-ai-info__reason"></p>
				  <p class="spr-ai-info__notice">
				    ※ <strong>AI의 추천 가격</strong>이며,
				    최종 가격은 <strong>판매자 판단</strong>에 따라 결정됩니다
				  </p>

				  <button type="button" class="spr-ai-info__apply">
				    평균가 적용
				  </button>
				</div>
      </div>
    </section>

    <hr class="spr-divider">

    <!-- ===============================
         Description
         EDIT: th:field
    =============================== -->
    <section class="spr-section">
      <label class="spr-section__title">자세한 설명</label>
      <textarea class="spr-textarea"
                rows="6"
				id="description"
                th:field="*{description}"></textarea>
    </section>

    <hr class="spr-divider">

    <!-- ===============================
         Trade Type
         EDIT: checked
    =============================== -->
    <section class="spr-grid">
      <div class="spr-panel">
        <h2 class="spr-section__title">거래 방식</h2>

        <div class="spr-tx">
          <label class="spr-tx__card">
            <input type="radio" name="tradeType" value="DIRECT"
                   th:checked="*{tradeType} == 'DIRECT'">
				   <div class="spr-tx__text">
				   	      <p class="spr-tx__title">직거래</p>
				   	      <p class="spr-tx__desc">동네 이웃과 직접 만나서 거래합니다.</p>
				   	    </div>
				   	    <span class="material-symbols-outlined spr-tx__icon">handshake</span>
          </label>

          <label class="spr-tx__card">
            <input type="radio" name="tradeType" value="DELIVERY"
                   th:checked="*{tradeType} == 'DELIVERY'">
				   <div class="spr-tx__text">
				   	      <p class="spr-tx__title">택배거래</p>
				   	      <p class="spr-tx__desc">택배를 통해 물건을 보내고 받습니다.</p>
				   	    </div>
				   	    <span class="material-symbols-outlined spr-tx__icon">local_shipping</span>
          </label>

          <label class="spr-tx__card">
            <input type="radio" name="tradeType" value="ALL"
                   th:checked="*{tradeType} == 'ALL'">
				   <div class="spr-tx__text">
				   	      <p class="spr-tx__title">직거래 + 택배</p>
				   	      <p class="spr-tx__desc">직거래와 택배 거래 모두 가능합니다.</p>
				   	    </div>
				   	    <span class="material-symbols-outlined spr-tx__icon">sync_alt</span>
          </label>
        </div>
      </div>

      <!-- ===============================
           Region
           EDIT: SSR 표시
      =============================== -->
      <div class="spr-panel">
        <h2 class="spr-section__title">거래 희망 장소</h2>
		<span class="spr-place__hint">클릭해서 장소를 선택하세요</span>
		<div class="spr-place">
        <div class="spr-place__map" onclick="openProductRegionModal()">
			<span class="material-symbols-outlined spr-place__icon">location_on</span>
			<span class="spr-place__label"
                id="selectedRegionLabel"
                th:text="*{regionDisplayName}">
          </span>
        </div>

        <input type="hidden" th:field="*{regionSidoCode}">
        <input type="hidden" th:field="*{regionSigunguCode}">
        <input type="hidden" th:field="*{regionEupmyeondongCode}">
        <input type="hidden" th:field="*{regionDisplayName}">
      </div>
    </section>

    <!-- ===============================
         Actions
    =============================== -->
    <div class="spr-actions">
      <a href="/" class="btn btn-outline">취소</a>
      <button type="submit"
              class="btn btn-primary spr-actions__submit">
        수정하기
      </button>
    </div>

  </form>

  <th:block th:replace="seller/product-region-modal :: product-region-modal"/>
</div>

<th:block th:fragment="pageJs">
  <script th:src="@{/js/seller/product-edit.js}"></script>
  <script th:src="@{/js/seller/product-region.js}"></script>
</th:block>

</html>
