<div class="login-modal is-hidden"
     th:fragment="find-password-modal"
     id="findPasswordModal">

  <div class="login-modal__backdrop" onclick="closeFindPasswordModal()"></div>

  <section class="login-modal__panel stack">
    <button class="login-modal__close" onclick="closeFindPasswordModal()">
      <span class="material-symbols-outlined">close</span>
    </button>

    <!-- Header -->
    <header class="login-modal__header stack text-center">
      <h2 class="login-modal__title">비밀번호 찾기</h2>
      <p class="login-modal__desc">
        본인인증 후 비밀번호를 변경할 수 있어요
      </p>
    </header>

    <!-- STEP 1: 이메일 입력 + 인증 -->
    <div id="pwAuthArea" class="stack gap-16">
      <div class="login-modal__field stack">
        <label for="targetEmail">아이디(이메일)</label>
        <input type="email"
               id="targetEmail"
               placeholder="가입한 이메일을 입력해주세요">
      </div>

      <button type="button"
              class="btn btn-primary"
              onclick="checkEmailAndVerify()">
        본인인증하고 비밀번호 변경하기
      </button>
    </div>

    <!-- STEP 2: 비밀번호 재설정 -->
    <div id="pwResetArea"
         class="find-pw__reset is-hidden stack gap-16">

      <div class="find-pw__success text-center">
        <p class="find-pw__success-title">본인인증 성공</p>
        <p class="find-pw__success-desc">
          새로운 비밀번호를 설정해주세요
        </p>
      </div>

      <div class="login-modal__field stack">
        <label for="newPassword">새 비밀번호</label>
        <input type="password"
               id="newPassword"
               placeholder="새 비밀번호 입력">
      </div>

      <div class="login-modal__field stack">
        <label for="confirmPassword">비밀번호 확인</label>
        <input type="password"
               id="confirmPassword"
               placeholder="비밀번호 재입력">
      </div>

      <button type="button"
              class="btn btn-primary"
              onclick="updatePassword()">
        비밀번호 변경 완료
      </button>
    </div>

  </section>
</div>
