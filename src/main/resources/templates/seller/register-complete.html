<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">

<th:block th:fragment="pageCss">
  <link rel="stylesheet" href="/css/seller/register-complete.css">
</th:block>

<div layout:fragment="content" class="seller-register-complete">

  <section class="complete-card">

    <div class="complete-icon">
      <span class="material-symbols-outlined">check_circle</span>
    </div>

    <h1 class="complete-title">
      판매자 등록이 완료되었습니다
    </h1>
	
	<p class="complete-desc">
	  이제 상품을 등록하고 판매를 시작할 수 있습니다.<br>
	  <strong><span id="redirect-count">10</span>초</strong> 후 메인 페이지로 이동합니다.
	</p>

    <div class="complete-actions">
      <a href="/seller/product/register" class="btn btn-primary">
        상품 등록하기
      </a>
      <a href="/" class="btn btn-outline">
        메인으로 이동
      </a>
    </div>

  </section>

</div>

<th:block th:fragment="pageJs">
	<script src="/js/seller/register-complete.js"></script>
</th:block>

</html>
