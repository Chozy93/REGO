<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">

<!-- =========================
     PAGE CSS
========================= -->
<th:block th:fragment="pageCss">
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"/>
  <link rel="stylesheet" href="/css/main/main-fix.css">

</th:block>

<!-- =========================
     CONTENT
========================= -->
<div class="main-wrap" layout:fragment="content">

  <!-- =========================
       MAIN LAYOUT
  ========================= -->
  <div class="main-layout">
	<!-- =========================
	     banner
	 ========================= -->
	<main class="main-container">
	    <div class="hero-banner">
	        <img alt="쇼핑 배너 배경" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCrRomZzEJyGCwDIILi5ynM1mAjnUYvljI_GMyqWRRxihauFY9B95LtN2BdaQLOE2BJZV-HSNSOg-PmrD026XxDxTnwWo8HqLxxtJDXgxyB7QjsuIgNffm9qcQ0zUO73XzgEk_IwAl3Gor1g-ge6HvsTDsRVJK7C_0YzmpW-Aa9Dm7BbHFdgtJFlrbtnAdBxtp7O-oXfK6LEACRezj1E_MN15JGFKov30P1cn1C05SB-VtTNlDiT0Rl1gislc946xyQZhuGGjX-LoQ"/>
	        <div class="hero-overlay">
	            <div class="hero-content">
	                <h2>동네 이웃들과<br/>따뜻한 거래를 시작하세요</h2>
	                <p>가까운 이웃과 함께하는 중고거래, RE: GO에서 지금 바로 만나보세요.</p>
	                <button class="btn-primary">지금 시작하기</button>
	            </div>
	        </div>
	    </div>
		
		<!-- =========================
		      위치 LAYOUT
		 ========================= -->
		
		<div class="filter-indicator-container" th:if="${currentRegion != null and currentRegion != ''}" 
		     style="margin: 20px 0; padding: 15px 20px; background: #fff; border: 1px solid #eee; border-radius: 12px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 2px 8px rgba(0,0,0,0.05);">
		    <div style="display: flex; align-items: center; gap: 8px;">
		        <span class="material-symbols-outlined" style="color: #ff5a5f;">location_on</span>
		        <span style="font-size: 1.1em;">
		            <strong th:text="${currentRegion}" style="color: #333;">서울특별시 강남구</strong> 지역 상품 결과입니다.
		        </span>
		    </div>
		    <a th:href="@{/(sort=${sort})}" class="filter-reset-btn" 
		       style="display: flex; align-items: center; gap: 4px; color: #888; text-decoration: none; font-size: 0.9em; padding: 6px 12px; border-radius: 20px; background: #f0f0f0; transition: all 0.2s;">
		        전체 지역 보기 <span class="material-symbols-outlined" style="font-size: 18px;">close</span>
		    </a>
		</div>
		
		<!-- =========================
		      상품 section
		 ========================= -->

		 <div class="sections-wrapper">
		     <section th:if="${page.popular != null and #lists.size(page.popular.items) > 0}">
		         <div class="section-header">
		             <h3>인기 상품</h3>
		             <a class="view-all" href="#">
		                 전체보기
		                 <span class="material-symbols-outlined" style="font-size: 16px;">chevron_right</span>
		             </a>
		         </div>
		         
		         <div class="product-grid">
		             <div class="product-card" th:each="card : ${page.popular.items}">
		                 <div class="image-box">
		                     <img th:alt="${card.title}" th:src="${card.img}"/>
		                     <div class="status-badge" th:if="${card.reserved}">예약중</div>
		                     <button class="wish-btn">
		                         <span class="material-symbols-outlined" 
		                               th:style="${card.liked} ? 'font-size: 20px; color: #ff5a5f;' : 'font-size: 20px;'">
		                             favorite
		                         </span>
		                     </button>
		                 </div>
		                 <div class="product-info">
		                     <h4 th:text="${card.title}">상품 제목</h4>
		                     <div class="price-tag">
		                         <span class="price" th:text="${#numbers.formatInteger(card.price, 0, 'COMMA') + '원'}">350,000원</span>
		                         <div class="meta-info">
		                             <span th:text="${card.loc}">지역</span> · <span th:text="${card.time}">시간</span>
		                         </div>
		                     </div>
		                 </div>
		             </div>
		         </div>
		     </section>

		     <section th:if="${page.recent != null and #lists.size(page.recent.items) > 0}">
		         <div class="section-header">
		             <h3>최근 등록된 상품</h3>
		             <a class="view-all" href="#">전체보기 <span class="material-symbols-outlined" style="font-size: 16px;">chevron_right</span></a>
		         </div>
		         <div class="product-grid">
		             <div class="product-card" th:each="card : ${page.recent.items}">
		                 <div class="image-box">
		                     <img th:alt="${card.title}" th:src="${card.img}"/>
		                     <div class="status-badge" th:if="${card.reserved}">예약중</div>
		                     <button class="wish-btn">
		                         <span class="material-symbols-outlined" 
		                               th:style="${card.liked} ? 'font-size: 20px; color: #ff5a5f;' : 'font-size: 20px;'">
		                             favorite
		                         </span>
		                     </button>
		                 </div>
		                 <div class="product-info">
		                     <h4 th:text="${card.title}">상품 제목</h4>
		                     <div class="price-tag">
		                         <span class="price" th:text="${#numbers.formatInteger(card.price, 0, 'COMMA') + '원'}">가격</span>
		                         <div class="meta-info">
		                             <span th:text="${card.loc}">지역</span> · <span th:text="${card.time}">시간</span>
		                         </div>
		                     </div>
		                 </div>
		             </div>
		         </div>
		     </section>
		 </div>
	</main>
	</div>

<!-- =========================
     PAGE JS
========================= -->
<th:block th:fragment="pageJs">
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  <script th:src="@{/js/common/swiper-init.js}"></script>
  <script th:src="@{/js/product-like.js}"></script>
  <script th:src="@{/js/main.js}"></script>
  <script th:src="@{/js/recent-view-main.js}"></script>
</th:block>

</html>
