<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">

<th:block th:fragment="pageCss">
  <link rel="stylesheet" href="/css/customer/customer.css">
  <link rel="stylesheet" href="/css/customer/faq.css">
  <link rel="stylesheet" href="/css/customer/sidebar.css">
</th:block>

<div layout:fragment="content" class="container-content">

  <div class="customer-layout">

    <!-- Sidebar -->
    <th:block th:replace="fragments/sidebar/policy-sidebar :: sidebar(currentMenu='faq')"></th:block>

    <main class="customer-main">

      <!-- Header -->
      <div class="customer-header">
		<a href="#" class="customer-back" onclick="history.back()">
		         <span class="material-symbols-outlined">arrow_back</span>
		       </a>
        <div>
          <h1 class="customer-title">자주 묻는 질문</h1>
          <p class="customer-desc">
            궁금한 점이 있으신가요? 자주 묻는 질문에서 빠르게 답변을 찾아보세요.
          </p>
        </div>
      </div>

      <!-- 검색 -->
      <section class="customer-card">
        <div class="customer-card-body">
            <div class="search-box">
              <span class="material-symbols-outlined search-icon">search</span>
              <input type="text" class="search-bar" placeholder="궁금한 내용을 검색해보세요">
            </div>

             <div class="filter-tags">
              <button class="tag active">전체</button>
              <button class="tag">회원/계정</button>
              <button class="tag">구매/판매</button>
              <button class="tag">결제/환불</button>
              <button class="tag">배송</button>
            </div>
          </div>
      </section>

      <!-- FAQ 리스트 -->

          <div class="faq-list">
			
            <details class="faq-item">
              <summary>
                <div class="q-content">
                  <span class="category">회원/계정</span>
                  <h3 class="question">회원 탈퇴는 어떻게 하나요?</h3>
                </div>
                <span class="material-symbols-outlined arrow">expand_more</span>
              </summary>
              <div class="answer">
                <p>회원 탈퇴는 마이페이지 &gt; 설정 &gt; 회원 탈퇴 메뉴에서 진행 가능합니다.</p>
              </div>
            </details>

          </div>
  

    </main>
  </div>
</div>
</html>
