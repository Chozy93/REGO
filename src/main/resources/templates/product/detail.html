<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">

<!-- PAGE CSS -->
<th:block th:fragment="pageCss">
  <link rel="stylesheet" th:href="@{/css/product/detail.css}">
  <link rel="stylesheet" th:href="@{/css/fragments/report-modal.css}">
</th:block>

<!-- PAGE JS -->
<th:block th:fragment="pageJs">
  <script src="/js/product/detail.js"></script>
  <script src="/js/product/detail-report.js"></script>
  <script src="/js/product/recent-view.js"></script>
</th:block>

<div class="container-content" layout:fragment="content">
	
	<!-- 최근 본 상품 저장용 productId -->
	  <input type="hidden" id="productId" th:value="${page.product.productId}"/>


  <div class="product-detail-grid">

    <!-- =========================
         LEFT : 상품 이미지
    ========================= -->
    <div class="detail-left">
      <section class="product-detail-media">
        <div class="product-image-main">
          <img th:if="${page.product != null and !#lists.isEmpty(page.product.imageUrls)}"
               th:src="${page.product.imageUrls[0]}"
               alt="상품 이미지"/>

          <img th:if="${page.product == null or #lists.isEmpty(page.product.imageUrls)}"
               src="/images/no-image.png"
               alt="기본 이미지"/>
        </div>
      </section>
    </div>

    <!-- =========================
         RIGHT : 상품 요약 / 액션 / 판매자
    ========================= -->
    <div class="detail-right">

      <!-- 상품 요약 -->
      <div class="info-card product-summary">

        <div class="product-summary-header">
          <h1 class="product-title"
              th:text="${page.product.productName}"></h1>
			  
		 <!-- 판매 상태 뱃지 -->
			   <span class="badge product-status-badge"
			          th:text="${page.product.salesStatusLabel}"
			          th:classappend="
			            ${page.isSold} ? ' badge-sold' :
			            (${page.isReserved} ? ' badge-reserved' : ' badge-selling')">
			    </span>

          <button type="button"
                  class="product-report-btn"
                  data-action="open-report-modal"
                  th:data-login="${page.login}"
                  th:data-product-id="${page.product.productId}"
                  th:disabled="${page.login == true and page.alreadyReported == true}"
                  th:text="${page.login == true and page.alreadyReported == true ? '신고 완료' : '⋮'}">
          </button>
        </div>

        <div class="product-price"
             th:text="${page.product.price}"></div>

        <div class="product-meta">
          <span>조회 <b th:text="${page.product.viewCount}"></b></span>
        </div>
      </div>

      <!-- 하단 액션 -->
      <div class="action-card product-detail">

        <button type="button"
                class="product-card__like-btn"
                th:data-product-id="${page.product.productId}"
                th:data-login="${page.login ? 'true' : 'false'}">

          <span class="material-symbols-outlined"
                th:classappend="${page.product.liked} ? ' filled' : ''">
            favorite
          </span>
        </button>

        <button type="button"
                id="dealBtn"
                class="btn-primary"
                th:data-login="${page.login ? 'true' : 'false'}">
          채팅하기
        </button>

        <button class="btn-dark">바로구매</button>
      </div>

      <!-- 판매자 카드 -->
      <a class="info-card seller-card"
         th:if="${page.sellerInfo != null}"
         th:href="@{/seller/{id}(id=${page.sellerInfo.sellerId})}">

        <div class="seller-header">
          <span class="material-symbols-outlined">person</span>
          <span class="seller-nickname"
                th:text="${page.sellerInfo.nickname}"></span>

          <span class="seller-badge"
                th:if="${page.sellerInfo.newSeller}">
            신규 판매자
          </span>
        </div>

        <div class="seller-stats">
          <div>상품 <b th:text="${page.sellerInfo.productCount}"></b>개</div>
          <div th:text="${page.sellerInfo.ratingLabel}"></div>
        </div>
      </a>

    </div>

    <!-- =========================
         BOTTOM : 설명 / 비슷한 상품
    ========================= -->
    <div class="detail-bottom">

      <div class="info-card product-description">
        <h3>상품 정보</h3>
        <p th:text="${page.product.description}"></p>
      </div>

      <section class="section"
               th:if="${!#lists.isEmpty(page.similar.items)}">

        <div class="section-head">
          <h3 class="section-title">비슷한 상품</h3>
        </div>

        <div class="grid grid-products">
          <article th:each="item : ${page.similar.items}">
            <a th:href="@{/product/{id}(id=${item.productId})}">
              <img th:src="${item.thumbnailUrl}">
              <div th:text="${item.productName}"></div>
              <div th:text="${item.price}"></div>
            </a>
          </article>
        </div>
      </section>

    </div>

  </div>

  <th:block th:replace="fragments/report-modal :: report-modal"></th:block>

</div>
</html>
