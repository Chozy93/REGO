<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <th:block layout:fragment="pageCss">
        <link rel="stylesheet" href="/css/main/main.css">
        <script src="https://cdn.tailwindcss.com"></script>
        <script>
            tailwind.config = {
                corePlugins: { preflight: false, container: false },
                important: '#tailwind-zone', 
                theme: { extend: { colors: { "primary": "#13ec5b" } } }
            }
        </script>
        <style>
            #tailwind-zone {
                font-family: 'Manrope', 'Noto Sans KR', sans-serif;
                background-color: #f8faf9;
                min-height: 100vh;
            }
            footer, .footer { display: none !important; }
        </style>
    </th:block>
</head>
<body>
	<div layout:fragment="content">
	    <div id="tailwind-zone">
	        <div class="w-full max-w-2xl mx-auto px-4 py-8 flex flex-col gap-4">
	            
	            <div class="flex items-center gap-3">
	                <button onclick="history.back()" class="p-2 -ml-2 rounded-full hover:bg-gray-100 transition-colors text-gray-700">
	                    <span class="material-symbols-outlined" style="font-size: 24px;">chevron_left</span>
	                </button>
	                <h1 class="text-2xl font-extrabold text-[#111813] tracking-tight">설정</h1>
	            </div>

	            <div class="flex flex-col gap-6">
	                <section>
	                    <h2 class="text-sm font-bold text-gray-500 px-1 mb-3">계정 및 알림</h2>
	                    <div class="grid grid-cols-1 gap-3">
                        <a href="/mypage/edit" class="flex items-center justify-between p-4 bg-white dark:bg-white/5 rounded-2xl border border-[#f0f4f2] dark:border-white/5 hover:border-primary/50 hover:shadow-sm transition-all group">
                            <div class="flex items-center gap-4">
                                <div class="size-10 rounded-xl bg-gray-50 dark:bg-white/10 flex items-center justify-center text-gray-500 dark:text-gray-300 group-hover:text-primary group-hover:bg-primary/10 transition-colors">
                                    <span class="material-symbols-outlined">manage_accounts</span>
                                </div>
                                <div>
                                    <div class="font-bold text-[#111813] dark:text-white group-hover:text-primary transition-colors">내 정보 관리</div>
                                    <div class="text-xs text-gray-400 dark:text-gray-500 mt-0.5">프로필, 닉네임, 주소 등 수정</div>
                                </div>
                            </div>
                            <span class="material-symbols-outlined text-gray-300 group-hover:text-primary group-hover:translate-x-1 transition-all">chevron_right</span>
                        </a>
                        
                        <a href="/mypage/settings/notifications" class="flex items-center justify-between p-4 bg-white dark:bg-white/5 rounded-2xl border border-[#f0f4f2] dark:border-white/5 hover:border-primary/50 hover:shadow-sm transition-all group">
                            <div class="flex items-center gap-4">
                                <div class="size-10 rounded-xl bg-gray-50 dark:bg-white/10 flex items-center justify-center text-gray-500 dark:text-gray-300 group-hover:text-primary group-hover:bg-primary/10 transition-colors">
                                    <span class="material-symbols-outlined">notifications</span>
                                </div>
                                <div>
                                    <div class="font-bold text-[#111813] dark:text-white group-hover:text-primary transition-colors">알림 설정</div>
                                    <div class="text-xs text-gray-400 dark:text-gray-500 mt-0.5">푸시 알림, 채팅 알림 설정</div>
                                </div>
                            </div>
                            <span class="material-symbols-outlined text-gray-300 group-hover:text-primary group-hover:translate-x-1 transition-all">chevron_right</span>
                        </a>
                    </div>
                </section>

                <section>
                    <h2 class="text-sm font-bold text-gray-500 dark:text-gray-400 px-1 mb-3">서비스 정보</h2>
                    <div class="grid grid-cols-1 gap-3">
                        <a href="/support" class="flex items-center justify-between p-4 bg-white dark:bg-white/5 rounded-2xl border border-[#f0f4f2] dark:border-white/5 hover:border-primary/50 hover:shadow-sm transition-all group">
                            <div class="flex items-center gap-4">
                                <div class="size-10 rounded-xl bg-gray-50 dark:bg-white/10 flex items-center justify-center text-gray-500 dark:text-gray-300 group-hover:text-primary group-hover:bg-primary/10 transition-colors">
                                    <span class="material-symbols-outlined">headset_mic</span>
                                </div>
                                <div>
                                    <div class="font-bold text-[#111813] dark:text-white group-hover:text-primary transition-colors">고객센터</div>
                                    <div class="text-xs text-gray-400 dark:text-gray-500 mt-0.5">자주 묻는 질문, 1:1 문의</div>
                                </div>
                            </div>
                            <span class="material-symbols-outlined text-gray-300 group-hover:text-primary group-hover:translate-x-1 transition-all">chevron_right</span>
                        </a>

                        <a href="/privacy" class="flex items-center justify-between p-4 bg-white dark:bg-white/5 rounded-2xl border border-[#f0f4f2] dark:border-white/5 hover:border-primary/50 hover:shadow-sm transition-all group">
                            <div class="flex items-center gap-4">
                                <div class="size-10 rounded-xl bg-gray-50 dark:bg-white/10 flex items-center justify-center text-gray-500 dark:text-gray-300 group-hover:text-primary group-hover:bg-primary/10 transition-colors">
                                    <span class="material-symbols-outlined">policy</span>
                                </div>
                                <span class="font-bold text-[#111813] dark:text-white group-hover:text-primary transition-colors">개인정보 처리방침</span>
                            </div>
                            <span class="material-symbols-outlined text-gray-300 group-hover:text-primary group-hover:translate-x-1 transition-all">chevron_right</span>
                        </a>

                        <a href="/terms" class="flex items-center justify-between p-4 bg-white dark:bg-white/5 rounded-2xl border border-[#f0f4f2] dark:border-white/5 hover:border-primary/50 hover:shadow-sm transition-all group">
                            <div class="flex items-center gap-4">
                                <div class="size-10 rounded-xl bg-gray-50 dark:bg-white/10 flex items-center justify-center text-gray-500 dark:text-gray-300 group-hover:text-primary group-hover:bg-primary/10 transition-colors">
                                    <span class="material-symbols-outlined">description</span>
                                </div>
                                <span class="font-bold text-[#111813] dark:text-white group-hover:text-primary transition-colors">이용약관</span>
                            </div>
                            <span class="material-symbols-outlined text-gray-300 group-hover:text-primary group-hover:translate-x-1 transition-all">chevron_right</span>
                        </a>

                        <a href="/location" class="flex items-center justify-between p-4 bg-white dark:bg-white/5 rounded-2xl border border-[#f0f4f2] dark:border-white/5 hover:border-primary/50 hover:shadow-sm transition-all group">
                            <div class="flex items-center gap-4">
                                <div class="size-10 rounded-xl bg-gray-50 dark:bg-white/10 flex items-center justify-center text-gray-500 dark:text-gray-300 group-hover:text-primary group-hover:bg-primary/10 transition-colors">
                                    <span class="material-symbols-outlined">location_on</span>
                                </div>
                                <span class="font-bold text-[#111813] dark:text-white group-hover:text-primary transition-colors">위치정보 이용약관</span>
                            </div>
                            <span class="material-symbols-outlined text-gray-300 group-hover:text-primary group-hover:translate-x-1 transition-all">chevron_right</span>
                        </a>
                    </div>
                </section>

                <section>
                    <h2 class="text-sm font-bold text-gray-500 dark:text-gray-400 px-1 mb-3">기타</h2>
                    <div class="grid grid-cols-1 gap-3">
                        <button onclick="location.href='/mypage/settings/withdraw'"
                                class="w-full flex items-center justify-between p-4 bg-white dark:bg-white/5 rounded-2xl border border-[#f0f4f2] dark:border-white/5 hover:bg-red-50 dark:hover:bg-red-900/10 hover:border-red-100 dark:hover:border-red-900/20 transition-all group text-left cursor-pointer">
                            <div class="flex items-center gap-4">
                                <div class="size-10 rounded-xl bg-gray-50 dark:bg-white/10 flex items-center justify-center text-gray-400 dark:text-gray-500 group-hover:text-red-500 group-hover:bg-red-100 dark:group-hover:bg-red-900/30 transition-colors">
                                    <span class="material-symbols-outlined">person_off</span>
                                </div>
                                <span class="font-bold text-gray-500 dark:text-gray-400 group-hover:text-red-600 dark:group-hover:text-red-400 transition-colors">회원 탈퇴</span>
                            </div>
                            <span class="material-symbols-outlined text-gray-300 group-hover:text-red-500 transition-all">chevron_right</span>
                        </button>
                    </div>
                </section>
            </div>
        </div>
    </div>
</div>
</body>
</html>
