<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">

<th:block th:fragment="pageCss">
  <link rel="stylesheet" href="/css/customer/customer.css">
  <link rel="stylesheet" href="/css/customer/faq.css">
  <link rel="stylesheet" href="/css/customer/sidebar.css">
</th:block>




<div layout:fragment="content" class="container-content">
     <div class="customer-layout">
      
      
    <!-- Sidebar -->
    <th:block th:replace="fragments/sidebar/policy-sidebar :: sidebar(currentMenu='faq')"></th:block>

         <main class="customer-main">
            <div class="customer-header">
              <a href="#" class="customer-back" onclick="history.back()">
		         <span class="material-symbols-outlined">arrow_back</span>
		       </a>
                <div>
                     <h1 class="customer-title">자주 묻는 질문</h1>
                    <p class="customer-desc">궁금한 점이 있으신가요? 자주 묻는 질문에서 빠르게 답변을 찾아보세요.</p>
                </div>
            </div>

            <section class="customer-card">
                <div class="customer-card-body">
                  
             
           
             <div class="search-box">
                    <span class="material-symbols-outlined search-icon">search</span>
                    <input type="text" id="faqSearch" placeholder="궁금한 내용을 검색해보세요" onkeyup="filterFaq()">
                    </div>
                </div>

                <div class="filter-tags">
					<button class="tag active" onclick="filterCategory('ALL')">전체</button>
					<button class="tag" onclick="filterCategory('MEMBER_ACCOUNT')">회원/계정</button>
					<button class="tag" onclick="filterCategory('PURCHASE_SALE')">구매/판매</button>
					<button class="tag" onclick="filterCategory('PAYMENT_REFUND')">결제/환불</button>
					<button class="tag" onclick="filterCategory('DELIVERY')">배송</button>
                </div>
            </section>

			<section class="faq-list" id="faqAccordion">
			    <details class="faq-item"
			             th:each="faq : ${faqList}"
			             th:data-category="${faq.faqCategoryCode}">

			        <summary>
			            <div class="q-content">
			                <!-- 화면 표시용 -->
			                <span class="category"
			                      th:text="${faq.faqCategoryLabel}">
			                    카테고리
			                </span>

			                <h3 class="question"
			                    th:text="${faq.question}">
			                    질문
			                </h3>
			            </div>

			            <span class="material-symbols-outlined arrow">expand_more</span>
			        </summary>

			        <div class="answer">
			            <p th:text="${faq.answer}"
			               style="white-space: pre-wrap;">
			                답변
			            </p>
			        </div>
			    </details>

			    <div id="noResult"
			         style="display: none; text-align: center; padding: 50px; color: #666;">
			        검색 결과가 없습니다.
			    </div>
			</section>

        </main>
    </div>
    <th:block th:fragment="pageJs">
    <script src="/js/customer/faq.js"></script>
</th:block>
</div>
</html>
