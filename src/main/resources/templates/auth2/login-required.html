<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">

<th:block th:fragment="pageCss">
  <link rel="stylesheet" href="/css/auth/login-required.css">
</th:block>

<div layout:fragment="content" class="login-required">

  <div class="login-required__card">
    <h1 class="login-required__title">
      로그인이 필요한 서비스입니다
    </h1>

    <p class="login-required__desc">
      해당 기능은 로그인 후 이용하실 수 있습니다.<br>
      RE:GO에 로그인하고 안전한 거래를 시작해 보세요.
    </p>

    <a href="/" class="btn btn-primary">
      홈으로 이동
    </a>
  </div>

</div>
</html>
